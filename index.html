async function openStorage(){try{if(localStorage.getItem(DBNAME+'-backend')==='localStorage'){storageMode='localStorage';const raw=localStorage.getItem(DBNAME);showStorageError('Using the localStorage fallback selected on this device. Keep regular JSON backups.');return raw?JSON.parse(raw):null;}}catch(e){}try{db=await new Promise((res,rej)=>{const req=indexedDB.open(DBNAME,3);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE);};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);req.onblocked=()=>rej(Error('Close another Dayline tab to finish the storage upgrade.'));});db.onversionchange=()=>{db.close();showStorageError('Storage changed in another tab. Reload this page before editing.');};const raw=await new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return raw;}catch(e){storageMode='localStorage';try{localStorage.setItem(DBNAME+'-backend','localStorage');const raw=localStorage.getItem(DBNAME);showStorageError('IndexedDB is unavailable. Using localStorage for this small, local-only dataset. Export regular backups.');return raw?JSON.parse(raw):null;}catch(err){storageFailed=true;throw Error('Device storage could not be opened: '+err.message);}}}

function snapshot(){const x=clone(data);delete x.undo;return JSON.stringify(x);}
function mutate(label,fn,{undo=true,render=true,notify=true}={}){if(undo){data.undo.push({label,state:snapshot()});data.undo=data.undo.slice(-12);}fn();data.meta.revision++;save();if(render)renderApp();if(undo&&notify)toast(label,true);}

let toastTimer;function toast(msg,canUndo=false){const el=$('#toast');el.innerHTML='<span class="grow">'+esc(msg)+'</span>'+(canUndo?'<button data-action="undo">Undo</button>':'')+'<button data-action="hide-toast" aria-label="Dismiss message">✕</button>';el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),canUndo?10000:5000);}
function targetAt(date){const h=data.settings.history.filter(x=>x.from<=date).sort((a,b)=>a.from.localeCompare(b.from));return clone((h.at(-1)||data.settings.history[0]).targets);}
function category(id){return data.categories.find(c=>c.id===id)||{id,name:'Archived category',color:'#888',archived:true};}
function sleepBlock(d){return d.blocks.find(b=>b.finalSleep);}
function blockDuration(b){return Math.max(0,(b.category==='sleep'&&Number.isFinite(b.actualEnd)?b.actualEnd:b.end)-(b.category==='sleep'&&Number.isFinite(b.actualStart)?b.actualStart:b.start));}
function blockEnd(b){return b.finalSleep&&Number.isFinite(b.actualEnd)?b.actualEnd:b.end;}
function dayEnd(d){return blockEnd(sleepBlock(d));}
function dayRecords(date,epoch=null){return Object.values(data.days).filter(d=>d.date===date&&(!epoch||d.epochId===epoch)).sort((a,b)=>(a.start-b.start)||(a.createdAt||0)-(b.createdAt||0));}
function findDay(date){return dayRecords(date).at(-1)||null;}
function getDay(id){return data.days[id];}
function activeDay(){return getDay(data.meta.activeId);}
function displayedDay(){return view.id&&getDay(view.id)||findDay(view.date);}
function pausedDate(date){return data.meta.pauses.some(p=>date>=p.start&&(!p.end||date<=p.end)&&(!p.resumedDate||date<p.resumedDate));}
function paused(d){return !!d?.paused||(!d?.resumeFresh&&pausedDate(d?.date||dateKey()));}
function createDay(date,start=420,{active=false,freshSession=false}={}){let existing=findDay(date);if(existing&&!freshSession&&!existing.ended&&!existing.paused){if(active)data.meta.activeId=existing.id;return existing;}const id=existing?date+'~'+uid():date;const d={id,date,start,blocks:[],base:[],planned:false,fitness:{plan:false,diet:false},note:'',targets:targetAt(date),epochId:data.meta.epochId,alerts:{},ended:false,paused:pausedDate(date),createdAt:Date.now(),resumeFresh:freshSession};d.blocks=[{id:uid(),category:'sleep',start:Math.max(1380,start+15),end:Math.max(1860,start+495),title:'Sleep',note:'',status:'unmarked',finalSleep:true}];for(const s of data.series){const spec=seriesBlockOn(s,date);if(spec&&!spec.finalSleep)d.blocks.push({...clone(spec),id:uid(),seriesId:s.id,originDate:date,status:'unmarked'});}d.blocks.sort((a,b)=>a.start-b.start);if(d.blocks.length>1){fitSeries(d);d.planned=true;}d.base=clone(d.blocks);data.days[id]=d;if(active)data.meta.activeId=id;return d;}
function fitSeries(d){const final=sleepBlock(d),normal=d.blocks.filter(b=>!b.finalSleep).sort((a,b)=>a.start-b.start),fixed=normal.filter(b=>b.status==='done'),placed=[...fixed];for(const b of normal.filter(b=>b.status!=='done')){const len=b.end-b.start;let start=Math.max(d.start,b.start),collision;while((collision=placed.find(x=>start<x.end&&start+len>x.start)))start=collision.end;b.start=start;b.end=start+len;placed.push(b);}placed.sort((a,b)=>a.start-b.start);const edge=Math.max(d.start,...placed.map(b=>b.end)),len=final.end-final.start;final.start=Math.max(final.start,edge);final.end=final.start+len;d.blocks=[...placed,final];}
function ensureDay(date){const before=findDay(addDays(date,-1));let start=420;if(before){const boundary=fromMinutes(before.date,dayEnd(before));if(boundary.date===date)start=boundary.minute;}return findDay(date)||createDay(date,start);}
function editable(d){return !!d&&((!d.ended&&d.date>=(activeDay()?.date||dateKey()))||view.unlocked.has(d.id))&&!paused(d);}
function totals(d,projected=false){const out={};if(!d||paused(d))return out;for(const b of d.blocks){if(b.status==='done'||(projected&&b.status==='unmarked'))out[b.category]=(out[b.category]||0)+blockDuration(b);}return out;}
const mapped=(t,categories)=>categories.reduce((n,id)=>n+(t[id]||0),0);
function fitnessHit(d){return !paused(d)&&(d.targets.fitnessMode==='either'?(d.fitness.plan||d.fitness.diet):(d.fitness.plan&&d.fitness.diet));}
function successful(d){if(!d||paused(d))return false;const t=totals(d);return Object.entries(d.targets.daily).filter(([k])=>k!=='sleep').every(([,r])=>mapped(t,r.categories)>=r.minutes)&&fitnessHit(d);}
function resultFor(date){const ds=dayRecords(date);if(!ds.length)return pausedDate(date)?'paused':null;const d=ds.at(-1);if(paused(d))return 'paused';if(successful(d))return 'successful';if(Object.values(totals(d)).some(n=>n>0)||d.fitness.plan||d.fitness.diet)return 'partial';return d.ended?'missed':null;}
function streak(){let n=0,anchor=activeDay()?.date||dateKey(),seen=false;const cutoff=addMonths(dateKey(),-4);for(let date=anchor;date>=cutoff&&date>=data.meta.createdDate;date=addDays(date,-1)){const ds=dayRecords(date);if(pausedDate(date)||ds.length&&ds.every(paused))continue;const d=ds.at(-1);if(!d||!successful(d)){if(!seen&&d&&!d.ended){seen=true;continue;}break;}seen=true;n++;}return n;}
function gapList(d){const sorted=[...d.blocks].sort((a,b)=>a.start-b.start),g=[];let cursor=d.start;for(const b of sorted){if(b.start>cursor)g.push({start:cursor,end:b.start});cursor=Math.max(cursor,b.end);}return g;}
function validatePlan(blocks,start=0){if(!Array.isArray(blocks)||!blocks.length)return 'A final Sleep block is required.';const fs=blocks.filter(b=>b.finalSleep);if(fs.length!==1||fs[0].category!=='sleep')return 'Keep exactly one final Sleep block in the Sleep category.';const sorted=[...blocks].sort((a,b)=>a.start-b.start);let edge=start;for(const b of sorted){if(!data.categories.some(c=>c.id===b.category))return 'Choose an existing category.';if(!Number.isInteger(b.start)||!Number.isInteger(b.end)||b.start<0||b.end<=b.start||b.end>10080)return 'Use valid times, with the end after the start (up to 7 days).';if(b.start<edge)return 'Blocks overlap or start before this day begins. Move or resize them.';edge=b.end;}if(sorted.at(-1).id!==fs[0].id)return 'The final Sleep block must be the last block.';return null;}
function changedCount(d){const base=new Map(d.base.map(b=>[b.id,b]));let n=d.base.filter(b=>!d.blocks.some(x=>x.id===b.id)).length;for(const b of d.blocks){const a=base.get(b.id);if(!a||['start','end','category','title','note'].some(k=>(a[k]||'')!==(b[k]||'')))n++;}return n;}
function commitPlan(d,blocks,label='Plan saved',other=()=>{}){const err=validatePlan(blocks,d.start);if(err)return err;mutate(label,()=>{d.blocks=blocks.sort((a,b)=>a.start-b.start);if(!d.planned){d.base=clone(d.blocks);d.planned=true;}other();});queueAlerts(d,'plan');return null;}
/* Calendar recurrence, including exception instances moved independently of a series. */
function repeatsOn(item,date){const anchor=item.date,r=item.repeat||{freq:'none'};if(date<anchor||r.until&&date>r.until)return false;if(r.freq==='none')return date===anchor;const delta=ordinal(date)-ordinal(anchor),a=dateObj(anchor),d=dateObj(date),n=Math.max(1,Number(r.interval)||1);const freq=r.freq==='custom'?(r.unit||'daily'):r.freq;if(freq==='daily')return delta%n===0;if(freq==='weekly'){const days=r.days?.length?r.days:[a.getDay()];const weeks=Math.floor((ordinal(weekStart(date))-ordinal(weekStart(anchor)))/7);return weeks%n===0&&days.includes(d.getDay());}const months=(d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth();if(freq==='monthly')return months%n===0&&date===addMonths(anchor,months);if(freq==='yearly'){const years=d.getFullYear()-a.getFullYear();return years%n===0&&date===addMonths(anchor,years*12);}return false;}
function occurrences(item,from,to){const out=[],ex=item.exceptions||{};for(let date=from;date<=to;date=addDays(date,1)){if(!repeatsOn(item,date)||ex[date])continue;out.push({...item,date,originDate:date,seriesId:item.id,isOccurrence:item.repeat?.freq!=='none'});}for(const [origin,x]of Object.entries(ex)){if(!x.cancelled&&x.date>=from&&x.date<=to)out.push({...item,...x,date:x.date,originDate:origin,seriesId:item.id,isOccurrence:true});}return out.sort((a,b)=>a.date.localeCompare(b.date)||(a.time??0)-(b.time??0));}
function eventsOn(date,filtered=false){return data.events.flatMap(e=>occurrences(e,date,date)).filter(e=>!filtered||data.settings.calendars[e.kind==='task'?'deadline':e.kind]!==false);}
function seriesBlockOn(s,date){if(s.exceptions?.[date]?.cancelled)return null;if(s.exceptions?.[date]?.block)return s.exceptions[date].block;if(!repeatsOn(s,date))return null;return s.block;}
function weekly(anchor,mode='rolling',projected=false,targets=null){const t=targets||findDay(anchor)?.targets||targetAt(anchor),from=mode==='rolling'?addDays(anchor,-6):weekStart(anchor),to=mode==='rolling'?anchor:addDays(from,6);const rows=[];for(let date=from;date<=to;date=addDays(date,1)){const ds=dayRecords(date,data.meta.epochId).filter(d=>!paused(d));const valid=date>=data.meta.epochStart&&!pausedDate(date);const day=ds.at(-1);const finished=valid&&(date<(activeDay()?.date||dateKey())||!!day?.ended);const total={};for(const d of ds)for(const [k,v]of Object.entries(totals(d,projected)))total[k]=(total[k]||0)+v;const counted=valid&&(finished||!!day?.planned||!!day&&Object.keys(totals(day)).length>0);const sleep=mapped(total,t.weekly.sleep.categories);let capacity=0;if(valid&&!finished){if(day){const now=day.id===data.meta.activeId?nowMinute(day.date):day.start;const unmarked=day.blocks.filter(b=>b.status==='unmarked').reduce((n,b)=>n+blockDuration(b),0);const futureOther=day.blocks.filter(b=>b.status!=='unmarked').reduce((n,b)=>n+Math.max(0,b.end-Math.max(now,b.start)),0);capacity=Math.max(unmarked,Math.max(0,dayEnd(day)-Math.max(day.start,now))-futureOther+day.blocks.filter(b=>b.status==='unmarked'&&b.start<now).reduce((n,b)=>n+Math.max(0,Math.min(now,b.end)-b.start),0));}else capacity=1440;}rows.push({date,day,total,sleep,valid,finished,counted,fitness:ds.some(fitnessHit),capacity});}const sums={};for(const [k,r]of Object.entries(t.weekly))sums[k]=rows.reduce((n,x)=>n+mapped(x.total,r.categories),0);const lows6=rows.filter(x=>x.valid&&(x.finished||projected&&x.counted)&&x.sleep<t.sleepRules.under6Minutes).length;const lows75=rows.filter(x=>x.valid&&(x.finished||projected&&x.counted)&&x.sleep<t.sleepRules.under75Minutes).length;return {anchor,mode,from,to,t,rows,sums,lows6,lows75,fitness:rows.filter(x=>x.fitness).length,daysLeft:rows.filter(x=>x.valid&&!x.finished).length,capacity:rows.reduce((n,x)=>n+x.capacity,0),warm:anchor>=data.meta.epochStart&&ordinal(anchor)-ordinal(data.meta.epochStart)<7};}
function weeklyRows(w,actual=null){const a=actual||w;const maxExtra=w.warm?Math.max(0,6-(ordinal(w.anchor)-ordinal(data.meta.epochStart)))*1440:0;const cap=w.capacity+(w.mode==='rolling'?maxExtra:0);const rows=[];for(const [k,r]of Object.entries(w.t.weekly)){const value=a.sums[k],target=r.minutes,remaining=Math.max(0,target-value),impossible=value+cap<target;rows.push({key:k,name:r.name,value,target,remaining,pace:w.daysLeft?Math.ceil(remaining/w.daysLeft):remaining,state:value>=target?'on track':impossible?'impossible':w.sums[k]>=target?'on track':'at risk',unit:'time'});}for(const [key,name,value,target]of [['low6','Nights under '+duration(w.t.sleepRules.under6Minutes),a.lows6,w.t.sleepRules.under6Allowed],['low75','Nights under '+duration(w.t.sleepRules.under75Minutes),a.lows75,w.t.sleepRules.under75Allowed]]){const endedLows=w.rows.filter(x=>x.finished&&x.sleep<(key==='low6'?w.t.sleepRules.under6Minutes:w.t.sleepRules.under75Minutes)).length;rows.push({key,name,value,target,remaining:Math.max(0,target-value),pace:0,state:endedLows>target?'impossible':w[key==='low6'?'lows6':'lows75']>target?'at risk':'on track',unit:'max'});}const v=a.fitness,remaining=Math.max(0,w.t.fitnessDays-v),extraDays=w.warm?Math.ceil(maxExtra/1440):0;rows.push({key:'fitness',name:'Fitness days',value:v,target:w.t.fitnessDays,remaining,pace:w.daysLeft?remaining/w.daysLeft:remaining,state:v>=w.t.fitnessDays?'on track':v+w.rows.filter(x=>x.valid&&!x.finished&&!x.fitness).length+extraDays<w.t.fitnessDays?'impossible':'at risk',unit:'days'});return rows;}
function alignStart(d,newStart,shift=true){const delta=newStart-d.start;if(shift){for(const b of d.blocks){if(b.status==='unmarked'){b.start+=delta;b.end+=delta;if(b.actualStart!=null)b.actualStart+=delta;if(b.actualEnd!=null)b.actualEnd+=delta;}}}else{d.blocks=d.blocks.filter(b=>b.finalSleep||b.end>newStart);for(const b of d.blocks){b.start=Math.max(b.start,newStart);if(b.finalSleep&&b.end<=b.start)b.end=b.start+480;}}d.start=newStart;}
function advanceClock(){if(!data||!loaded)return;const now=new Date();let changed=false,loops=0;let ended=[];if(!activeDay()){createDay(dateKey(),420,{active:true});changed=true;}let d=activeDay();while(!paused(d)&&nowMinute(d.date,now)>=dayEnd(d)&&loops++<4000){d.ended=true;ended.push(d);const boundary=fromMinutes(d.date,dayEnd(d));let next=findDay(boundary.date);if(!next||next.ended||next.id===d.id)next=createDay(boundary.date,boundary.minute,{freshSession:next?.id===d.id});else if(next.start!==boundary.minute){const old=next.start;alignStart(next,boundary.minute,true);if(next.planned)view.shift={id:next.id,delta:boundary.minute-old,oldStart:old,newStart:boundary.minute,alreadyShifted:true};}next.epochId=data.meta.epochId;if(!pausedDate(next.date))next.paused=false;data.meta.activeId=next.id;d=next;changed=true;}
const p=data.meta.pauses.find(p=>!p.resumedDate&&p.end&&dateKey(now)>p.end);if(p){resumeData(p);changed=true;}if(changed){data.meta.revision++;save();if(view.tab==='today'){view.id=null;view.date=activeDay().date;}renderApp();for(const x of ended.slice(-1))queueAlerts(x,'end');if(view.shift&&!view.alertActive)showWakeShift();}checkRetention();}

function heading(eyebrow,title,sub='',right=''){return '<div class="pagehead"><div class="eyebrow">'+eyebrow+'</div><div class="row between"><h1>'+title+'</h1>'+right+'</div>'+(sub?'<p class="subtitle">'+sub+'</p>':'')+'</div>';}
function dayStatus(d){return paused(d)?'Paused':successful(d)?'Minimums met':d.ended?'Day archived':'In progress';}
function progressMetrics(d){const done=totals(d),proj=totals(d,true);return Object.entries(d.targets.daily).map(([k,r])=>{const v=mapped(done,r.categories),p=mapped(proj,r.categories),target=r.minutes;return '<div class="metric"><div class="row between"><span>'+esc(r.name)+(k==='sleep'?' <span class="tag">Alert only</span>':'')+'</span><span class="num"><b>'+duration(v)+'</b> <span class="muted">/ '+duration(target)+'</span></span></div><div class="bar" role="progressbar" aria-label="'+esc(r.name)+' completed" aria-valuemin="0" aria-valuemax="'+target+'" aria-valuenow="'+Math.min(v,target)+'"><span class="done" style="width:'+Math.min(100,v/Math.max(1,target)*100)+'%"></span><span class="projected" style="width:'+Math.min(Math.max(0,100-v/Math.max(1,target)*100),Math.max(0,p-v)/Math.max(1,target)*100)+'%"></span></div><div class="small">'+(v>=target?'Met':duration(Math.max(0,target-v))+' to go')+' · '+duration(p)+' projected</div></div>';}).join('');}
function timeline(d,{planning=false}={}){const n=nowMinute(d.date),isToday=d.id===data.meta.activeId,readOnly=!editable(d),arr=[...d.blocks].sort((a,b)=>a.start-b.start);let html='',cursor=d.start,inserted=false;for(const b of arr){if(b.start>cursor)html+=gapHTML(d,cursor,b.start,readOnly);if(isToday&&!inserted&&n<b.end){html+='<div class="now">Now · '+timeLong(n)+'</div>';inserted=true;}const overdue=isToday&&b.end<=n&&b.status==='unmarked',live=isToday&&n>=b.start&&n<b.end&&b.status==='unmarked';const state=b.status==='done'?'Done':b.status==='skipped'?'Skipped':overdue?'Overdue':live?'Now':'Upcoming';const c=category(b.category);html+='<article class="block '+b.status+(overdue?' overdue':'')+(live?' live':'')+'" style="--cat:'+esc(c.color)+'">'+(view.selecting&&!readOnly?'<input aria-label="Select '+esc(b.title||c.name)+'" type="checkbox" class="selectbox" data-select="'+esc(b.id)+'"'+(view.selected.has(b.id)?' checked':'')+'>':'')+'<div class="time">'+time(b.start)+'<br>'+timeLong(b.end)+'</div><div class="grow"><button class="editblock" data-action="edit-block" data-p="'+esc(JSON.stringify({day:d.id,id:b.id}))+'"><span class="title">'+esc(b.title||c.name)+'</span><div class="details">'+esc(c.name)+' · '+duration(blockDuration(b))+(b.finalSleep?' · Final sleep':'')+(b.seriesId?' · Repeats':'')+'</div></button><span class="tag '+(b.status==='done'?'good':overdue?'warn':'')+'">'+state+'</span>'+(b.actualStart!=null?'<div class="details">Actual '+timeLong(b.actualStart)+'–'+timeLong(b.actualEnd??b.end)+'</div>':'')+(b.note?'<div class="details">'+esc(b.note)+'</div>':'')+'</div>'+(!readOnly&&!view.selecting?button(b.status==='done'?'✓':b.status==='skipped'?'−':'✓','mark',{day:d.id,id:b.id},'mark'):'')+'</article>';cursor=Math.max(cursor,b.end);}if(isToday&&!inserted)html+='<div class="now">Now · '+timeLong(n)+'</div>';return html;}
function gapHTML(d,start,end,readOnly){return '<div class="unplanned"><div>'+timeLong(start)+'–'+timeLong(end)+'<br><b>Unplanned</b> · '+duration(end-start)+'</div>'+(!readOnly?button('Fill with Free','fill-free',{day:d.id,start,end}):'')+'</div>';}
function setupOptions(d,date){return '<div class="card empty"><span class="eyebrow">A little structure helps</span><h2 class="gap">Make room for your day</h2><p>Start with a template, copy a day, or build your own. Every day closes with Sleep.</p><div class="grid2">'+button('Copy yesterday','copy-yesterday',{date},'soft')+button('Copy any day','copy-day',{date})+button('Weekday template','use-template',{date,type:'weekday'})+button('Weekend template','use-template',{date,type:'weekend'})+'</div><div class="row wrap gap">'+button('+ Add a block','add-block',{date},'primary grow')+button('Recurring blocks','series-list',{},'grow')+'</div></div>';}
function renderToday(){const d=activeDay();if(!d)return '';const t=totals(d),sum=Object.values(t).reduce((a,b)=>a+b,0),base=d.base.reduce((n,b)=>n+b.end-b.start,0),n=nowMinute(d.date),expected=d.base.reduce((a,b)=>a+clamp(n-b.start,0,b.end-b.start),0),delta=Math.round(sum-expected),minMet=Object.entries(d.targets.daily).filter(([k,r])=>k!=='sleep'&&mapped(t,r.categories)>=r.minutes).length+(fitnessHit(d)?1:0),next=d.blocks.filter(b=>b.status==='unmarked'&&b.end>n).sort((a,b)=>a.start-b.start)[0];const upcoming=data.events.flatMap(e=>occurrences(e,d.date,addDays(d.date,30))).filter(e=>['deadline','task'].includes(e.kind)&&!e.completed).sort((a,b)=>a.date.localeCompare(b.date)||(a.time??1439)-(b.time??1439)).slice(0,3);
return heading(dateLabel(d.date),paused(d)?'A pause is part of the plan.':'One day at a time.',d.date!==dateKey()?'Still the '+dateLabel(d.date,true)+' day. Your final sleep ends it.':dayStatus(d),button('Skip','pause',{},'plain'))+(paused(d)?'<div class="notice">Tracking is paused. Your history and streak are safe. '+button('Resume now','resume',{},'soft')+'</div>':'')+'<div class="columns"><section><div class="card summary"><div><div class="eyebrow">Daily minimums</div><div class="big gap">'+minMet+'<span class="muted"> / 5</span></div><small>Sleep is alert-only</small></div><div><div class="eyebrow">Plan adherence</div><div class="big gap">'+(base?Math.round(sum/base*100):0)+'<span class="muted">%</span></div><small>'+duration(sum)+' of '+duration(base)+'</small></div></div>'+(paused(d)?'':'<div class="notice good gap">'+(delta===0?'Right on your base plan':Math.abs(delta)+' min '+(delta>0?'ahead':'behind'))+'<span class="small"> · '+streak()+' consecutive successful days</span></div>')+'<div class="sectionhead"><h2>Your timeline</h2><div class="row">'+button(view.selecting?'Cancel':'Select','toggle-select',{},'plain')+button('+','add-block',{date:d.date,day:d.id},'soft')+'</div></div>'+(view.selecting?'<div class="card gap"><div class="small">'+view.selected.size+' selected</div><div class="row wrap gap">'+button('Done','mark-selected',{day:d.id,status:'done'},'soft')+button('Skipped','mark-selected',{day:d.id,status:'skipped'})+button('All past done','past-done',{day:d.id})+'</div></div>':'')+(!d.planned?setupOptions(d,d.date):'')+timeline(d)+'<div class="row wrap gap">'+button('I’m awake / Start new day','awake',{day:d.id},'soft grow')+button('Edit plan','open-plan',{date:d.date,id:d.id},'grow')+'</div></section><aside><div class="sectionhead"><h2>Minimums, clearly</h2></div><div class="card">'+progressMetrics(d)+'<div class="legend gap"><span><i></i>Done</span><span><i class="projected"></i>Still planned</span></div></div><div class="card gap"><h3>Fitness</h3><label class="check"><input type="checkbox" data-fitness="plan" data-day="'+d.id+'"'+(d.fitness.plan?' checked':'')+(paused(d)?' disabled':'')+'> Fitness plan followed</label><label class="check"><input type="checkbox" data-fitness="diet" data-day="'+d.id+'"'+(d.fitness.diet?' checked':'')+(paused(d)?' disabled':'')+'> Diet followed</label><small>'+(d.targets.fitnessMode==='both'?'Both boxes make a fitness hit.':'Either box makes a fitness hit.')+'</small></div><div class="card gap"><div class="eyebrow">'+(next&&n>=next.start?'In this moment':'Up next')+'</div><h2 class="gap">'+esc(next?(next.title||category(next.category).name):'Your day is complete')+'</h2><p class="subtitle">'+(next?timeLong(next.start)+'–'+timeLong(next.end)+' · '+duration(blockDuration(next)):'Review any unmarked blocks when you have a moment.')+'</p></div><div class="sectionhead"><h2>On the horizon</h2>'+button('+','edit-event',{date:d.date,kind:'deadline'},'plain')+'</div><div class="card">'+(upcoming.length?upcoming.map(e=>eventHTML(e,true)).join(''):'<p class="muted small">No deadlines in the next 30 days.</p>')+'</div><div class="sectionhead"><h2>A note for the day</h2></div><textarea id="dailyNote" data-note-day="'+d.id+'" placeholder="What deserves remembering?"'+(paused(d)?' disabled':'')+'>'+esc(d.note)+'</textarea><div class="footerinfo">Private by design. Saved on this device.</div></aside></div>';}
function renderPlan(){const date=view.date,d=displayedDay(),isPast=!!d?.ended||date<(activeDay()?.date||dateKey()),canEdit=d?editable(d):!isPast&&!pausedDate(date);return heading('Your days, with intention','The plan','Times with +1d belong to the next calendar date. The day ends after its final Sleep.')+'<div class="datebar">'+button('‹','plan-date',{date:addDays(date,-1)},'plain')+dateInput('planDate',date,addMonths(dateKey(),-4),addMonths(dateKey(),6))+button('›','plan-date',{date:addDays(date,1)},'plain')+'</div>'+(d&&dayRecords(date).length>1?'<label for="sessionSelect">Day sessions</label><select id="sessionSelect">'+dayRecords(date).map(x=>'<option value="'+x.id+'"'+(x.id===d.id?' selected':'')+'>'+timeLong(x.start)+' · '+(x.paused?'Paused session':x.ended?'Archived session':'Current session')+'</option>').join('')+'</select>':'')+(isPast&&!canEdit?'<div class="notice">This day is archived. '+button('Unlock to edit','unlock',{day:d?.id},'plain')+'</div>':'')+(d&&paused(d)?'<div class="notice">Paused days collect no progress. Future plans can still be prepared after the pause.</div>':'')+(!d||!d.planned?setupOptions(d,date):'')+(d?'<div class="columns space"><section><div class="sectionhead"><h2>'+dateLabel(date,true)+'</h2><span class="tag">Starts '+timeLong(d.start)+'</span></div>'+(canEdit?'<div class="row wrap gap">'+button('+ Block','add-block',{day:d.id,date},'primary')+button('Copy / templates','plan-options',{date,day:d.id})+button('Select','toggle-select')+'</div>':'')+(view.selecting&&canEdit?'<div class="row wrap gap">'+button('Mark done','mark-selected',{day:d.id,status:'done'},'soft')+button('Mark skipped','mark-selected',{day:d.id,status:'skipped'})+button('All past done','past-done',{day:d.id})+'</div>':'')+timeline(d)+(canEdit?'<div class="row wrap gap">'+button('Reset to base','reset-day',{day:d.id},'grow')+button('View original plan','base-plan',{day:d.id},'grow')+'</div>':'')+'</section><aside><div class="card"><div class="row between"><h2>Day tracker</h2><span class="tag '+(successful(d)?'good':'')+'">'+dayStatus(d)+'</span></div><div class="gap">'+progressMetrics(d)+'</div><label class="check"><input type="checkbox" data-fitness="plan" data-day="'+d.id+'"'+(d.fitness.plan?' checked':'')+(!canEdit?' disabled':'')+'> Fitness plan followed</label><label class="check"><input type="checkbox" data-fitness="diet" data-day="'+d.id+'"'+(d.fitness.diet?' checked':'')+(!canEdit?' disabled':'')+'> Diet followed</label></div><div class="card gap"><h3>Plan changes</h3><p class="small gap">'+changedCount(d)+' block changes from the original base plan.</p>'+button('Compare with base','base-plan',{day:d.id},'gap full')+(canEdit&&!d.ended?button('Use current as new base','rebase',{day:d.id},'plain full'):'')+'</div><div class="sectionhead"><h2>Day note</h2></div><textarea data-note-day="'+d.id+'"'+(!canEdit?' disabled':'')+'>'+esc(d.note)+'</textarea><div class="sectionhead"><h2>Calendar items</h2>'+button('+','edit-event',{date},'plain')+'</div><div class="card">'+(eventsOn(date).map(e=>eventHTML(e)).join('')||'<p class="small muted">No items on this date.</p>')+'</div><div class="small gap">Standards saved for this day. '+Object.values(d.alerts).filter(a=>a.bypassed).length+' alert bypasses recorded.</div></aside></div>':(!canEdit?'<p class="muted gap">No tracker was recorded on this date.</p>':''));}
function renderWeek(){const anchor=view.weekDate||activeDay().date,mode=view.weekMode,w=weekly(anchor,mode,true),a=weekly(anchor,mode,false),rows=weeklyRows(w,a);const drop=a.rows[0];return heading('A wider perspective','Your week',dateLabel(w.from,true)+' — '+dateLabel(w.to,true))+'<div class="row wrap between"><div class="pillgroup">'+button('Rolling 7','week-mode',{mode:'rolling'},mode==='rolling'?'active':'')+button('Mon–Sun','week-mode',{mode:'fixed'},mode==='fixed'?'active':'')+'</div><div style="max-width:180px">'+dateInput('weekDate',anchor,addMonths(dateKey(),-4),addMonths(dateKey(),6))+'</div></div>'+(w.warm?'<div class="notice good gap">Settling in · day '+Math.max(1,ordinal(anchor)-ordinal(data.meta.epochStart)+1)+' of 7. Weekly alerts only appear for targets that cannot be reached.</div>':'')+'<div class="columns space"><section class="card">'+rows.map(r=>{const value=r.unit==='time'?duration(r.value):r.value+' days',target=r.unit==='time'?duration(r.target):r.target+' days';return '<div class="weekmetric"><div class="row between"><h3>'+esc(r.name)+'</h3><span class="tag '+(r.state==='on track'?'good':r.state==='impossible'?'bad':'warn')+'">'+r.state+'</span></div><div class="row between gap"><div class="big">'+value+'</div><span class="small">'+(r.unit==='max'?'At most ':'of ')+target+'</span></div><div class="bar"><span class="done" style="width:'+Math.min(100,r.value/Math.max(1,r.target)*100)+'%"></span></div><div class="remaining">'+(r.unit==='max'?r.remaining+' short nights allowed before the limit':(r.unit==='time'?duration(r.remaining):r.remaining+' days')+' remaining')+' · '+w.daysLeft+' day'+(w.daysLeft===1?'':'s')+' left<br>'+(r.unit==='max'?'Short nights overlap: an under-6h night also counts under 7.5h.':r.remaining?('Pace: '+(r.unit==='time'?duration(r.pace):r.pace.toFixed(1)+' fitness days')+' per remaining day'):'Target reached')+'</div></div>';}).join('')+'</section><aside><div class="card"><h2>Days in this window</h2><div class="gap">'+a.rows.map(x=>'<div class="row between" style="min-height:49px">'+button(esc(dateLabel(x.date,true)),'open-plan',{date:x.date},'plain')+'<span class="tag '+(resultFor(x.date)==='successful'?'good':'')+'">'+(resultFor(x.date)||(!x.valid?'Outside tracking':x.finished?'Missed':'Open'))+'</span></div>').join('')+'</div></div>'+(mode==='rolling'?'<div class="card gap"><div class="eyebrow">Drops off tomorrow</div><h3 class="gap">'+dateLabel(drop.date,true)+'</h3><p class="small gap">'+Object.entries(w.t.weekly).map(([k,r])=>esc(r.name)+': '+duration(mapped(drop.total,r.categories))).join('<br>')+'<br>Fitness: '+(drop.fitness?'1 day':'0 days')+'<br>Short sleep: '+(drop.finished&&drop.sleep<w.t.sleepRules.under6Minutes?'under '+duration(w.t.sleepRules.under6Minutes):'—')+' / '+(drop.finished&&drop.sleep<w.t.sleepRules.under75Minutes?'under '+duration(w.t.sleepRules.under75Minutes):'—')+'</p></div>':'<div class="card gap"><h3>Monday reset</h3><p class="small gap">This view follows the Monday–Sunday labels of your days. A Sunday night’s sleep belongs to Sunday, even when it ends on Monday.</p></div>')+'<div class="card gap"><h3>How this adds up</h3><p class="small gap">The large numbers count Done blocks only. On-track states also consider your remaining plan. Reachability assumes you may rearrange all uncompleted time, including overdue blocks, before the day closes. Each target is tested separately.</p><p class="small gap">This window uses the standards saved on '+dateLabel(anchor,true)+'. Counters exclude time before the latest resume.</p></div></aside></div>';}
const calColors={important:'#a97553',event:'#5a8da0',deadline:'#a46677',task:'#a46677'};
function renderCalendar(){const month=view.month,first=weekStart(month),last=addDays(first,41),chosen=view.date;let cells='';for(let date=first;date<=last;date=addDays(date,1)){const ev=eventsOn(date,true),res=resultFor(date),kinds=[...new Set(ev.map(x=>x.kind==='task'?'deadline':x.kind))];cells+='<button class="calday'+(date.slice(0,7)!==month.slice(0,7)?' outside':'')+(date===dateKey()?' today':'')+(date===chosen?' chosen':'')+'" data-action="cal-date" data-p="'+esc(JSON.stringify({date}))+'" aria-label="'+esc(dateLabel(date)+(res?', '+res:'')+', '+ev.length+' calendar items')+'"><span>'+Number(date.slice(-2))+'</span><span class="caldots">'+kinds.map(k=>'<i class="circle" style="background:'+calColors[k]+'"></i>').join('')+'</span>'+(res?'<span class="resultdot '+res+'"></span>':'')+'</button>';}
return heading('A place for every day','Calendar','Plans, important dates, and the days you’ve lived.',button('+','edit-event',{date:chosen},'soft'))+'<div class="columns"><section><div class="card"><div class="row between"><h2>'+dateObj(month).toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h2><div class="row">'+button('‹','cal-month',{n:-1},'plain')+button('›','cal-month',{n:1},'plain')+'</div></div><div class="calfilters">'+[['important','Important Dates'],['event','Events'],['deadline','Deadlines']].map(([k,name])=>button('<span class="circle" style="background:'+calColors[k]+'"></span>'+name,'cal-toggle',{kind:k},data.settings.calendars[k]?'':'off')).join('')+'</div><div class="calgrid">'+['M','T','W','T','F','S','S'].map(x=>'<div class="weekday">'+x+'</div>').join('')+cells+'</div><div class="legend gap">'+['successful','partial','missed','paused'].map(x=>'<span><i class="resultdot '+x+'" style="background:'+(x==='successful'?'var(--accent)':x==='partial'?'var(--warn)':x==='missed'?'var(--bad)':'var(--muted)')+'"></i>'+x+'</span>').join('')+'</div></div><div class="card gap"><label for="searchBox">Search notes and calendar items</label><input type="search" id="searchBox" value="'+esc(view.search)+'" placeholder="Find something…"><div id="searchResults">'+searchHTML(view.search)+'</div></div></section><aside><div class="sectionhead"><h2>'+dateLabel(chosen,true)+'</h2>'+button('+','edit-event',{date:chosen},'plain')+'</div><div class="card">'+(eventsOn(chosen,true).map(e=>eventHTML(e)).join('')||'<p class="small muted">No visible items for this date.</p>')+'</div><div class="card gap"><div class="row between"><h3>Daily archive</h3><span class="tag">'+(resultFor(chosen)||'No tracker yet')+'</span></div><p class="small gap">'+(findDay(chosen)?duration(Object.values(totals(findDay(chosen))).reduce((a,b)=>a+b,0))+' completed · '+esc(findDay(chosen).note||'No daily note.'):'Open this date to make a plan or view its archive.')+'</p>'+button('Open day','open-plan',{date:chosen},'soft full gap')+'</div>'+button('Back to current month','cal-today',{},'plain full gap')+'</aside></div>';}
function countdown(e){const m=(ordinal(e.date)-ordinal(dateKey()))*1440+(e.time??1439)-(new Date().getHours()*60+new Date().getMinutes());return m<0?'Overdue by '+duration(Math.abs(m)):m<60?'Due in '+m+' min':m<1440?'Due in '+duration(m):'Due in '+Math.ceil(m/1440)+' days';}
function eventHTML(e,count=false){return '<div class="event"><span class="eventstripe" style="background:'+calColors[e.kind]+'"></span>'+(e.kind==='task'?'<input type="checkbox" aria-label="Complete '+esc(e.title)+'" data-task="'+esc(e.seriesId||e.id)+'" data-origin="'+esc(e.originDate||e.date)+'"'+(e.completed?' checked':'')+(paused(activeDay())?' disabled':'')+'>':'')+'<button class="titlebutton" data-action="edit-event" data-p="'+esc(JSON.stringify({id:e.seriesId||e.id,origin:e.originDate||e.date,date:e.date}))+'">'+esc(e.title)+'<small style="display:block">'+(count?esc(countdown(e)):esc(e.kind==='important'?'Important date':e.kind==='deadline'?'Deadline':e.kind==='task'?'Task':'Event'))+' · '+dateLabel(e.date,true)+(e.time!=null?' · '+time(e.time):'')+(e.repeat?.freq!=='none'?' · ↻':'')+'</small></button></div>';}
function searchHTML(query){const q=query.toLocaleLowerCase().trim();if(!q)return '';const found=[];for(const d of Object.values(data.days)){if((d.note+' '+d.blocks.map(b=>(b.note||'')+' '+(b.title||'')).join(' ')).toLocaleLowerCase().includes(q))found.push('<div class="searchresult">'+button(dateLabel(d.date,true)+'<small style="display:block">'+esc(d.note||'Matching block title or note')+'</small>','open-plan',{date:d.date,id:d.id},'plain')+'</div>');}for(const e of data.events){if((e.title+' '+e.note).toLocaleLowerCase().includes(q))found.push('<div class="searchresult">'+button(esc(e.title)+'<small style="display:block">'+dateLabel(e.date,true)+' · '+esc(e.note||'Calendar item')+'</small>','edit-event',{id:e.id,origin:e.date,date:e.date},'plain')+'</div>');for(const [origin,x]of Object.entries(e.exceptions||{})){if(!x.cancelled&&((x.title||'')+' '+(x.note||'')).toLocaleLowerCase().includes(q))found.push('<div class="searchresult">'+button(esc(x.title||e.title)+'<small style="display:block">'+dateLabel(x.date||origin,true)+' · '+esc(x.note||'Moved occurrence')+'</small>','edit-event',{id:e.id,origin,date:x.date||origin},'plain')+'</div>');}}return found.slice(0,50).join('')||'<p class="small gap">No matches.</p>';}
function renderMore(){return heading('Space to adjust','Make it yours','Your data stays on this device. Back it up when it matters.')+'<div class="columns"><section><div class="card">'+[['targets','Targets & category mapping','Daily minimums and both weekly views'],['categories','Categories','Names, colors, and archive'],['templates','Templates & recurring blocks','Weekday, weekend, and repeating schedules'],['settings','Appearance & alerts','Theme, snapping, and alert types'],['pause',paused(activeDay())?'Manage pause':'Skip / pause','Pause tracking and preserve your streak']].map(([act,name,sub])=>button('<span>'+name+'<small>'+sub+'</small></span><span class="arrow">›</span>',act,{},'menuitem')).join('')+'</div><div class="card gap">'+button('<span>Backup & transfer<small>Last backed up: '+(data.meta.lastBackup?new Date(data.meta.lastBackup).toLocaleString():'Never')+'</small></span><span class="arrow">›</span>','backup',{},'menuitem')+button('<span>Import a backup<small>Preview before replacing this device’s data</small></span><span class="arrow">›</span>','import',{},'menuitem')+button('<span>Undo last action<small>'+data.undo.length+' actions available</small></span><span class="arrow">↶</span>','undo',{},'menuitem')+'</div></section><aside><div class="card">'+button('<span>Reset today<small>Restore the original plan and clear checkmarks</small></span><span class="arrow">↶</span>','reset-day',{day:data.meta.activeId},'menuitem')+button('<span>Help & counting rules<small>How days, minimums, and weekly totals work</small></span><span class="arrow">›</span>','help',{},'menuitem')+button('<span>Data retention<small>Four months behind, six months ahead</small></span><span class="arrow">›</span>','retention',{},'menuitem')+button('<span>Wipe everything<small>Export first, then type the confirmation word</small></span><span class="arrow">›</span>','wipe',{},'menuitem danger')+'</div><div class="card gap"><h3>Just you and your time.</h3><p class="small gap">No accounts, feeds, scores, or automatic sync. '+(navigator.onLine?'Online':'Offline')+' · '+(storageMode==='indexeddb'?'IndexedDB':'localStorage fallback')+' · schema '+SCHEMA+'</p><p id="offlineStatus" class="small gap">'+esc(window.offlineState||'Checking offline availability…')+'</p></div><div class="footerinfo">Dayline 1.0 · Made for the life around the plan.</div></aside></div>';}
function renderApp(){if(!data)return;document.documentElement.dataset.theme=data.settings.theme;$('#tabs').innerHTML=['today','plan','week','calendar','more'].map(k=>'<button class="'+(view.tab===k?'active':'')+'" data-action="tab" data-p="'+esc(JSON.stringify({tab:k}))+'"'+(view.tab===k?' aria-current="page"':'')+'>'+icon(k)+'<span>'+k[0].toUpperCase()+k.slice(1)+'</span></button>').join('');const fn={today:renderToday,plan:renderPlan,week:renderWeek,calendar:renderCalendar,more:renderMore};$('#app').innerHTML='<main id="main">'+fn[view.tab]()+'</main>';$$('.mark').forEach(b=>{const p=JSON.parse(b.dataset.p);const block=getDay(p.day)?.blocks.find(x=>x.id===p.id);b.setAttribute('aria-label',(block?.status==='done'?'Unmark ':'Mark done: ')+(block?.title||category(block?.category).name));});}
let modalDismiss=null,lastFocus=null;
function modal(title,body,actions=[],dismiss=null){lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML='<div id="formError" class="err" role="alert"></div>'+body;$('#modalFoot').innerHTML=actions.map((a,i)=>'<button id="modalAction'+i+'" class="'+(a.cls||'')+'">'+esc(a.label)+'</button>').join('');actions.forEach((a,i)=>$('#modalAction'+i).onclick=async()=>{try{await a.run();}catch(e){formError(e.message);}});modalDismiss=dismiss;$('#modalBack').hidden=false;$('#shell').inert=true;document.body.style.overflow='hidden';$('#modal').focus();$('#modalBody').scrollTop=0;}
function closeModal(){const f=lastFocus;$('#modalBack').hidden=true;$('#shell').inert=false;document.body.style.overflow='';modalDismiss=null;if(f?.isConnected)f.focus();}
function dismissModal(){const f=modalDismiss;closeModal();if(f)f();}
function formError(msg){$('#formError').textContent=msg;$('#formError').scrollIntoView({block:'nearest'});}
const val=id=>$('#'+id)?.value;
const checked=id=>!!$('#'+id)?.checked;
function field(label,id,content){return '<div class="field"><label for="'+id+'">'+label+'</label>'+content+'</div>';}
function timeFields(prefix,m,label){const day=Math.floor(m/1440);return '<div class="field"><label for="'+prefix+'Time">'+label+'</label><div class="splitfields"><input id="'+prefix+'Time" type="time" step="'+data.settings.snap*60+'" value="'+time(m)+'" required><select id="'+prefix+'Day" aria-label="'+label+' date offset">'+Array.from({length:8},(_,n)=>'<option value="'+n+'"'+(day===n?' selected':'')+'>'+(!n?'Same day':'+'+n+' day'+(n===1?'':'s'))+'</option>').join('')+'</select></div></div>';}
function readTime(prefix,snap=true){let n=toMin(val(prefix+'Time'))+Number(val(prefix+'Day'))*1440;if(snap)n=Math.round(n/data.settings.snap)*data.settings.snap;return n;}
function categoryOptions(current,allowSleep=true){return data.categories.filter(c=>(!c.archived||c.id===current)&&(allowSleep||c.id!=='sleep')).map(c=>'<option value="'+esc(c.id)+'"'+(c.id===current?' selected':'')+'>'+esc(c.name)+'</option>').join('');}
function readyDay(date,id){if(id)return getDay(id);if(date>addMonths(dateKey(),6)||date<addMonths(dateKey(),-4))throw Error('Choose a date within the retained planning window.');let d=findDay(date);if(!d){if(date<activeDay().date)throw Error('No tracker exists for this archived date.');d=ensureDay(date);save();}return d;}
function blockEditor({day,id,date,start,end}={}){date=date||getDay(day)?.date||view.date;const d=readyDay(date,day),b=id?d.blocks.find(x=>x.id===id):null;if(!editable(d)){modal('Block details','<p>'+esc(b?.title||category(b?.category).name)+'</p><p class="small gap">'+(b?timeLong(b.start)+'–'+timeLong(b.end)+' · '+esc(b.note||''): 'This day is read-only.')+'</p>',[{label:'Close',run:closeModal}]);return;}const gap=gapList(d).find(g=>g.end-g.start>=15),s=start??b?.start??gap?.start??Math.max(d.start,sleepBlock(d).start-60),e=end??b?.end??Math.min(s+60,sleepBlock(d).start);const spec=b||{category:data.categories.find(c=>c.id==='work'&&!c.archived)?.id||data.categories.find(c=>!c.archived&&!['sleep','break','free'].includes(c.id))?.id||'free',start:s,end:Math.max(s+15,e),title:'',note:'',status:'unmarked'};const recurrence=b?.seriesId?'<div class="scope">'+field('Apply this edit to','blockScope','<select id="blockScope"><option value="one">This occurrence only</option><option value="series">Whole series from this day forward</option></select>')+'</div>':'';modal(b?'Edit block':'Add a block',recurrence+field('Category','blockCat','<select id="blockCat"'+(b?.finalSleep?' disabled':'')+'>'+categoryOptions(spec.category)+'</select>')+field('Title (optional)','blockTitle','<input id="blockTitle" maxlength="200" value="'+esc(spec.title)+'" placeholder="What is this time for?">')+'<div class="grid2">'+timeFields('blockStart',spec.start,'Start')+timeFields('blockEnd',spec.end,'End')+'</div><p class="small field">Offsets are relative to '+dateLabel(d.date,true)+'. Times snap to '+data.settings.snap+' minutes.</p>'+field('Status','blockStatus','<select id="blockStatus">'+['unmarked','done','skipped'].map(x=>'<option'+(x===spec.status?' selected':'')+' value="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</option>').join('')+'</select>')+field('Note (optional)','blockNote','<textarea id="blockNote" maxlength="10000">'+esc(spec.note)+'</textarea>')+(b?.finalSleep?'<div class="notice good">Final Sleep closes this day. It cannot be deleted. '+button('Log actual sleep','sleep-actual',{day:d.id,id:b.id},'plain full gap')+'</div>':'')+(b?'<div class="row wrap gap">'+button('Split block','split-block',{day:d.id,id:b.id})+(!b.finalSleep?button('Delete','delete-block',{day:d.id,id:b.id},'danger'):'')+'</div>':''),[{label:'Cancel',run:closeModal},{label:'Save block',cls:'primary',run:()=>{const ns=readTime('blockStart'),ne=readTime('blockEnd');if(!Number.isFinite(ns)||!Number.isFinite(ne))return formError('Enter valid start and end times.');const nb={...spec,id:b?.id||uid(),category:b?.finalSleep?'sleep':val('blockCat'),start:ns,end:ne,title:val('blockTitle').trim(),note:val('blockNote'),status:val('blockStatus')};if(nb.finalSleep&&(nb.start!==b.start||nb.end!==b.end)){delete nb.actualStart;delete nb.actualEnd;}const blocks=d.blocks.filter(x=>x.id!==b?.id).concat(nb);const err=validatePlan(blocks,d.start);if(err)return formError(err);const scope=val('blockScope');closeModal();commitPlan(d,blocks,b?'Block updated':'Block added',()=>{if(b?.seriesId)updateBlockSeries(d,nb,scope);});}}]);}
function updateBlockSeries(d,b,scope){const s=data.series.find(s=>s.id===b.seriesId);if(!s)return;s.exceptions=s.exceptions||{};if(scope==='series'){s.block={category:b.category,start:b.start,end:b.end,title:b.title,note:b.note};for(const other of Object.values(data.days)){if(other.id===d.id||other.date<d.date||other.ended||paused(other))continue;for(const x of other.blocks.filter(x=>x.seriesId===s.id&&x.status==='unmarked'&&!s.exceptions?.[x.originDate])){Object.assign(x,clone(s.block));}fitSeries(other);}}else s.exceptions[b.originDate||d.date]={block:{category:b.category,start:b.start,end:b.end,title:b.title,note:b.note}};}
function deleteBlock({day,id}){const d=getDay(day),b=d?.blocks.find(b=>b.id===id);if(!b||b.finalSleep||!editable(d))return;const series=b.seriesId;modal('Delete this block?',field('Delete from','deleteScope','<select id="deleteScope"><option value="one">This day only</option>'+(series?'<option value="series">Whole series from this day forward</option>':'')+'</select>')+'<p class="small">The original base plan stays available.</p>',[{label:'Keep block',run:()=>blockEditor({day,id})},{label:'Delete',cls:'danger',run:()=>{const scope=val('deleteScope');closeModal();mutate('Block deleted',()=>{d.blocks=d.blocks.filter(x=>x.id!==id);if(series){const s=data.series.find(x=>x.id===series);if(s){s.exceptions=s.exceptions||{};s.exceptions[b.originDate||d.date]={cancelled:true};if(scope==='series'){s.repeat.until=addDays(d.date,-1);for(const other of Object.values(data.days)){if(other.date>=d.date&&!other.ended)other.blocks=other.blocks.filter(x=>x.seriesId!==series);}}}}});queueAlerts(d,'plan');}}]);}
function splitBlock({day,id}){const d=getDay(day),b=d.blocks.find(x=>x.id===id);if(!editable(d))return;const midpoint=Math.round((b.start+b.end)/2/data.settings.snap)*data.settings.snap;modal('Split this time',timeFields('split',midpoint,'Split at')+field('Second block category','splitCategory','<select id="splitCategory"'+(b.finalSleep?' disabled':'')+'>'+categoryOptions(b.category)+'</select>')+'<p class="small">The final segment of a final Sleep block stays the day’s final Sleep.</p>',[{label:'Cancel',run:closeModal},{label:'Split block',cls:'primary',run:()=>{const n=readTime('split');if(n<=b.start||n>=b.end)return formError('Choose a time strictly inside this block.');const first={...b,end:n,finalSleep:false},second={...b,id:uid(),start:n,category:b.finalSleep?'sleep':val('splitCategory')};delete first.actualStart;delete first.actualEnd;delete second.actualStart;delete second.actualEnd;delete first.seriesId;delete second.seriesId;const blocks=d.blocks.filter(x=>x.id!==id).concat(first,second);closeModal();commitPlan(d,blocks,'Block split',()=>{if(b.seriesId){const s=data.series.find(x=>x.id===b.seriesId);if(s){s.exceptions=s.exceptions||{};s.exceptions[b.originDate||d.date]={cancelled:true};}}});}}]);}
function actualSleep({day,id}){const d=getDay(day),b=d.blocks.find(x=>x.id===id);if(!editable(d))return;const n=nowMinute(d.date);modal('Actual sleep',timeFields('actualStart',b.actualStart??Math.min(b.start,Math.max(d.start,n-480)),'Fell asleep')+timeFields('actualEnd',b.actualEnd??Math.max(d.start+1,n),'Woke up')+'<p class="small">Actual sleep counts when this block is Done. These exact minutes do not snap. A final sleep’s end becomes the day boundary.</p>',[{label:'Cancel',run:closeModal},{label:'Save sleep',cls:'primary',run:()=>{const start=readTime('actualStart',false),end=readTime('actualEnd',false);if(!Number.isFinite(start)||!Number.isFinite(end)||start<d.start||end<=start)return formError('Sleep must end after it starts, within this day.');closeModal();mutate('Actual sleep logged',()=>{b.actualStart=start;b.actualEnd=end;b.status='done';});if(b.finalSleep&&end!==b.end)data.meta.pendingWakeShift={oldEnd:b.end,newEnd:end,from:d.id};advanceClock();if(d.ended&&data.meta.pendingWakeShift){showWakeShift();}else queueAlerts(d,'plan');}}]);}
function awake({day}){const d=getDay(day),b=sleepBlock(d);if(paused(d)){toast('Resume tracking to start a fresh day.');return;}actualSleep({day:d.id,id:b.id});}
function showWakeShift(){const pending=data.meta.pendingWakeShift,already=view.shift;const d=activeDay();if(!d||(!pending&&!already))return;const delta=pending?pending.newEnd-pending.oldEnd:already.delta;if(!delta){delete data.meta.pendingWakeShift;view.shift=null;return;}const oldStart=already?.oldStart??d.start-delta;modal('Your wake-up time changed','<p>You woke '+duration(Math.abs(delta))+' '+(delta<0?'earlier':'later')+' than planned.</p><p class="small gap">'+(already?'The next plan has been shifted to start at your wake-up time.':'Choose how the remaining plan should follow your new start.')+'</p>',[{label:'Keep clock times',run:()=>{closeModal();mutate('Kept clock times',()=>{if(already?.alreadyShifted)alignStart(d,oldStart,true);alignStart(d,already?.newStart??d.start,false);delete data.meta.pendingWakeShift;view.shift=null;});queueAlerts(d,'plan');}},{label:'Shift remaining blocks',cls:'primary',run:()=>{closeModal();mutate('Plan follows wake-up',()=>{if(!already?.alreadyShifted){const previous=d.start;d.start=previous-delta;alignStart(d,previous,true);}delete data.meta.pendingWakeShift;view.shift=null;});queueAlerts(d,'plan');}}],()=>{delete data.meta.pendingWakeShift;view.shift=null;save();nextAlert();});}
</script>
<script>
/* Plans, templates, and recurrence editors. */
function starterTemplate(type){const parts=type==='weekend'?[['background',90],['fitness',60],['background',60],['work',180],['creative',90],['girlfriend',240],['parents',90],['friends',90],['free',60]]:[['background',60],['work',180],['background',90],['creative',60],['fitness',60],['girlfriend',210],['parents',60],['friends',60],['free',180]];let cursor=420;const blocks=parts.map(([category,len])=>{const b={id:uid(),category,start:cursor,end:cursor+len,title:'',note:'',status:'unmarked'};cursor+=len;return b;});blocks.push({id:uid(),category:'sleep',start:cursor,end:cursor+480,title:'Sleep',note:'',status:'unmarked',finalSleep:true});return {start:420,blocks};}
function copyBlocks(template,d){const blocks=clone(template.blocks).map(b=>{const x={...b,id:uid(),status:'unmarked'};delete x.actualStart;delete x.actualEnd;delete x.seriesId;delete x.originDate;return x;});const delta=d.start-(template.start??420);for(const b of blocks){b.start+=delta;b.end+=delta;}return blocks;}
function useTemplate({date,type}){const d=readyDay(date);if(!editable(d))return toast('This date is read-only.');const t=data.templates[type]||starterTemplate(type);modal('Use '+type+' template?','<p>This replaces the current schedule. Checkmarks start unmarked. Your original base plan remains available.</p>'+(!data.templates[type]?'<p class="small gap">A built-in starting point is ready. You can save your own template from any planned day.</p>':''),[{label:'Cancel',run:closeModal},{label:'Use template',cls:'primary',run:()=>{closeModal();commitPlan(d,copyBlocks(t,d),'Template applied');}}]);}
function copyDay({date,source}){if(!source){modal('Copy a day',field('Copy from','copySource',dateInput('copySource',addDays(date,-1),addMonths(dateKey(),-4),addMonths(dateKey(),6)))+'<p class="small">Copies the current schedule and clears completion statuses. The destination keeps its own day-start boundary.</p>',[{label:'Cancel',run:closeModal},{label:'Copy schedule',cls:'primary',run:()=>{const src=findDay(val('copySource'));if(!src?.planned)return formError('That date has no saved plan.');const d=readyDay(date);if(!editable(d))return formError('Unlock the destination day first.');const blocks=copyBlocks(src,d),err=validatePlan(blocks,d.start);if(err)return formError(err);closeModal();commitPlan(d,blocks,'Day copied');}}]);return;}const src=findDay(source);if(!src?.planned){copyDay({date});return;}const d=readyDay(date);if(!editable(d))return toast('Unlock the destination day first.');modal('Copy '+dateLabel(source,true)+'?','<p>Replace this schedule with that day’s current plan? Completion statuses are cleared.</p>',[{label:'Cancel',run:closeModal},{label:'Copy schedule',cls:'primary',run:()=>{closeModal();commitPlan(d,copyBlocks(src,d),'Day copied');}}]);}
function planOptions({date,day}){const d=getDay(day)||findDay(date);modal('Plan options','<div class="stack">'+button('Copy yesterday','copy-yesterday',{date})+button('Copy any day','copy-day',{date})+button('Use weekday template','use-template',{date,type:'weekday'})+button('Use weekend template','use-template',{date,type:'weekend'})+(d?.planned?button('Save this as weekday template','save-template',{day:d.id,type:'weekday'})+button('Save this as weekend template','save-template',{day:d.id,type:'weekend'}):'')+button('Recurring schedule blocks','series-list')+'</div>',[{label:'Close',run:closeModal}]);}
function repeatFields(r={freq:'none'},prefix='repeat'){const days=r.days||[];return field('Repeat',prefix+'Freq','<select id="'+prefix+'Freq">'+[['none','Does not repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly'],['custom','Custom interval']].map(([v,t])=>'<option value="'+v+'"'+(r.freq===v?' selected':'')+'>'+t+'</option>').join('')+'</select>')+'<div class="grid2">'+field('Every',''+prefix+'Interval','<input id="'+prefix+'Interval" type="number" min="1" max="365" value="'+(r.interval||1)+'">')+field('Custom unit',prefix+'Unit','<select id="'+prefix+'Unit">'+['daily','weekly','monthly','yearly'].map(x=>'<option value="'+x+'"'+(r.unit===x?' selected':'')+'>'+x+'</option>').join('')+'</select>')+'</div><div class="field"><label>Weekdays (weekly rules)</label><div class="pillgroup">'+[[1,'M'],[2,'T'],[3,'W'],[4,'T'],[5,'F'],[6,'S'],[0,'S']].map(([n,t])=>'<label class="check" style="flex:1;justify-content:center;flex-direction:column;gap:4px;font-size:12px"><input type="checkbox" data-repeat-day="'+prefix+'" value="'+n+'"'+(days.includes(n)?' checked':'')+'>'+t+'</label>').join('')+'</div></div>'+field('Repeat until (optional)',prefix+'Until','<input type="date" id="'+prefix+'Until" value="'+esc(r.until||'')+'">')+'<p class="small field">Intervals apply to the selected frequency. Month-end dates clamp to the last day; leap-day anniversaries use February 28 in other years.</p>';}
function readRepeat(prefix='repeat'){const n=Number(val(prefix+'Interval'));if(!Number.isInteger(n)||n<1||n>365)throw Error('Repeat interval must be an integer from 1 to 365.');const until=val(prefix+'Until');return {freq:val(prefix+'Freq'),interval:n,unit:val(prefix+'Unit'),days:$$('[data-repeat-day="'+prefix+'"]:checked').map(x=>Number(x.value)),until:until||null};}
function seriesList(){modal('Recurring schedule blocks','<p class="small field">These appear in plans on their matching dates. A one-day move becomes an exception; a series edit updates uncompleted current and future occurrences.</p><div class="stack">'+data.series.map(s=>button(esc(s.block.title||category(s.block.category).name)+'<small style="display:block">'+timeLong(s.block.start)+'–'+timeLong(s.block.end)+' · '+esc(s.repeat.freq)+'</small>','edit-series',{id:s.id},'full')).join('')+'</div>'+button('+ Recurring block','edit-series',{},'soft full gap'),[{label:'Close',run:closeModal}]);}
function seriesEditor({id}={}){const s=data.series.find(x=>x.id===id),b=s?.block||{category:'fitness',start:1020,end:1080,title:'',note:''},date=s?.date||activeDay().date;modal(s?'Edit recurring block':'New recurring block',field('Series starts','seriesDate',dateInput('seriesDate',date,'',addMonths(dateKey(),6)))+field('Category','seriesCat','<select id="seriesCat">'+categoryOptions(b.category)+'</select>')+field('Title','seriesTitle','<input id="seriesTitle" maxlength="200" value="'+esc(b.title)+'">')+'<div class="grid2">'+timeFields('seriesStart',b.start,'Start')+timeFields('seriesEnd',b.end,'End')+'</div>'+field('Note','seriesNote','<textarea id="seriesNote" maxlength="10000">'+esc(b.note)+'</textarea>')+repeatFields(s?.repeat||{freq:'weekly',days:[2,4]},'seriesRepeat')+'<div class="notice">If a repeating block overlaps an existing block, later blocks move forward to make room. Original base plans are preserved.</div>'+(s?button('Stop future occurrences','stop-series',{id:s.id},'danger full gap'):''),[{label:'Cancel',run:seriesList},{label:'Save series',cls:'primary',run:()=>{const anchor=val('seriesDate'),start=readTime('seriesStart'),end=readTime('seriesEnd');if(!validDate(anchor)||anchor>addMonths(dateKey(),6))return formError('Choose a valid series start within six months.');if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end>10080)return formError('End must be later than start.');const repeat=readRepeat('seriesRepeat');if(repeat.freq==='none')return formError('Choose a repeat rule, or add a single block in Plan.');if(repeat.until&&repeat.until<anchor)return formError('Repeat end must be on or after the series start.');const item={id:s?.id||uid(),date:anchor,repeat,block:{category:val('seriesCat'),start,end,title:val('seriesTitle'),note:val('seriesNote')},exceptions:s?.exceptions||{}};closeModal();mutate('Recurring block saved',()=>{if(s)Object.assign(s,item);else data.series.push(item);for(const d of Object.values(data.days)){if(d.ended||paused(d)||d.date<activeDay().date)continue;const wasPlanned=d.planned;d.blocks=d.blocks.filter(x=>x.seriesId!==item.id||x.status!=='unmarked');if(seriesBlockOn(item,d.date)&&!d.blocks.some(x=>x.seriesId===item.id)){d.blocks.push({...clone(seriesBlockOn(item,d.date)),id:uid(),seriesId:item.id,originDate:d.date,status:'unmarked'});d.planned=true;}fitSeries(d);if(!wasPlanned&&d.planned)d.base=clone(d.blocks);}});queueAlerts(activeDay(),'plan');}}]);}
function eventEditor({id,date,origin,kind}={}){const e=data.events.find(e=>e.id===id),occ=e?(occurrences(e,date||origin||e.date,date||origin||e.date).find(x=>x.originDate===(origin||e.date))||{...e,...e.exceptions?.[origin],date:date||e.date}):{date:date||view.date,kind:kind||'event',title:'',note:'',time:null,endTime:null,repeat:{freq:kind==='important'?'yearly':'none',interval:1}};if(e&&occ.date<activeDay().date&&!view.unlocked.has('calendar:'+occ.date)&&!view.unlocked.has(findDay(occ.date)?.id)){modal('Archived calendar item','<h3>'+esc(occ.title)+'</h3><p class="small gap">'+dateLabel(occ.date,true)+' · '+esc(occ.note||'')+'</p><p class="small gap">Unlock this date to change its archived item.</p>',[{label:'Close',run:closeModal},{label:'Unlock to edit',cls:'primary',run:()=>{view.unlocked.add('calendar:'+occ.date);eventEditor({id,date,origin,kind});}}]);return;}const repeating=e?.repeat?.freq&&e.repeat.freq!=='none';modal(e?'Edit calendar item':'Add calendar item',(repeating?field('Apply changes to','eventScope','<select id="eventScope"><option value="one">This occurrence only</option><option value="series">Whole series</option></select>'):'')+field('Calendar','eventKind','<select id="eventKind">'+[['important','Important Dates'],['event','Events'],['deadline','Deadlines'],['task','Task (Deadlines calendar)']].map(([k,t])=>'<option value="'+k+'"'+(occ.kind===k?' selected':'')+'>'+t+'</option>').join('')+'</select>')+field('Title','eventTitle','<input id="eventTitle" maxlength="300" value="'+esc(occ.title)+'" placeholder="What’s happening?">')+field('Date','eventDate',dateInput('eventDate',occ.date,'',addMonths(dateKey(),6)))+'<div class="grid2">'+field('Time (optional)','eventTime','<input id="eventTime" type="time" step="60" value="'+(occ.time!=null?time(occ.time):'')+'">')+field('End time (optional)','eventEnd','<input id="eventEnd" type="time" step="60" value="'+(occ.endTime!=null?time(occ.endTime):'')+'">')+'</div>'+field('Note','eventNote','<textarea id="e <script>
/* Advisory rules: a bypass is persisted per rule, day, and material value. */
function computeAlerts(d,reason='plan'){if(!d||paused(d)||!d.planned&&reason!=='end')return [];const projected=reason!=='end',t=totals(d,projected),out=[];const push=a=>{if(data.settings.alerts[a.type]===false)return;const seen=d.alerts[a.key],step=a.unit==='days'?1:a.key.startsWith('daily')?15:60;if(seen&&Math.abs(seen.value-a.value)<step&&seen.target===a.target)return;out.push({...a,day:d.id});};for(const [k,r]of Object.entries(d.targets.daily)){const value=mapped(t,r.categories);if(value>=r.minutes)continue;let why=projected?'Done plus unmarked blocks in this plan do not cover the saved minimum. Skipped blocks contribute no time.':'Only Done blocks count in this ended day. Unmarked and Skipped blocks contribute no time.';if(k==='sleep'){const w=weekly(d.date,'fixed',false,d.targets);why='Sleep is alert-only and never prevents a successful day. This Monday–Sunday week counts '+w.lows6+' days below '+duration(d.targets.sleepRules.under6Minutes)+' (allowed '+d.targets.sleepRules.under6Allowed+') and '+w.lows75+' below '+duration(d.targets.sleepRules.under75Minutes)+' (allowed '+d.targets.sleepRules.under75Allowed+').';}push({key:'daily:'+k,type:'daily_'+k,title:k==='sleep'?'A little less sleep planned':r.name+' is short',name:r.name,value,target:r.minutes,unit:'time',why,categories:r.categories,deficit:r.minutes-value,kind:k==='sleep'?'sleep':'convert'});}
if(reason==='end'&&!fitnessHit(d)){push({key:'daily:fitness',type:'daily_fitness',title:'Daily fitness checkboxes',name:'Fitness hit',value:0,target:1,unit:'days',why:'This day needs '+(d.targets.fitnessMode==='both'?'both the fitness and diet checkboxes':'either the fitness or diet checkbox')+'. Review the record if either was followed.',categories:['fitness'],kind:'fitness',deficit:1});}
for(const mode of ['rolling','fixed']){const w=weekly(d.date,mode,projected,d.targets),a=weekly(d.date,mode,false,d.targets),modeLabel=mode==='rolling'?'Rolling 7':'Monday–Sunday',warm=d.date>=data.meta.epochStart&&ordinal(d.date)-ordinal(data.meta.epochStart)<7;const warmExtra=mode==='rolling'&&warm?Math.max(0,6-(ordinal(d.date)-ordinal(data.meta.epochStart)))*1440:0;for(const [k,r]of Object.entries(d.targets.weekly)){const value=w.sums[k],max=a.sums[k]+w.capacity+warmExtra,impossible=max<r.minutes;if(value>=r.minutes||warm&&!impossible)continue;push({key:'weekly:'+mode+':'+k,type:'weekly_'+k,title:modeLabel+' · '+r.name,name:r.name,value,target:r.minutes,unit:'time',why:impossible?'Even reallocating every available uncompleted minute in this window cannot reach the target. '+duration(Math.max(0,w.capacity+warmExtra))+' remain available.':(projected?'Your Done and still-planned time is below the weekly target.':'This window’s actual Done time is below its target.')+' '+w.daysLeft+' day(s) remain in the window.',categories:r.categories,deficit:r.minutes-value,kind:k==='sleep'?'sleep':'convert'});}
for(const [key,threshold,allowed,value]of [['low6',d.targets.sleepRules.under6Minutes,d.targets.sleepRules.under6Allowed,w.lows6],['low75',d.targets.sleepRules.under75Minutes,d.targets.sleepRules.under75Allowed,w.lows75]]){const endedLow=a.rows.filter(x=>x.finished&&x.sleep<threshold).length,impossible=endedLow>allowed;if(value<=allowed||warm&&!impossible)continue;push({key:'weekly:'+mode+':'+key,type:'weekly_'+key,title:modeLabel+' · short sleep',name:'Days below '+duration(threshold),value,target:allowed,unit:'days',max:true,why:impossible?'The number of completed short-sleep days already exceeds the weekly tolerance.':(projected?'The current plans would exceed the short-sleep tolerance.':'Actual sleep has exceeded the weekly tolerance.')+' A night below both thresholds counts in both limits.',categories:['sleep'],deficit:Math.max(15,threshold-mapped(t,['sleep'])),kind:'sleep'});}
const hit=a.fitness,possible=hit+w.rows.filter(x=>x.valid&&!x.finished&&!x.fitness).length+Math.ceil(warmExtra/1440);if(hit<d.targets.fitnessDays&&(possible<d.targets.fitnessDays||!w.daysLeft)){push({key:'weekly:'+mode+':fitness',type:'weekly_fitness',title:modeLabel+' · Fitness',name:'Fitness days',value:hit,target:d.targets.fitnessDays,unit:'days',why:'A fitness day needs '+(d.targets.fitnessMode==='both'?'both checkboxes':'either checkbox')+'. '+possible+' hits are possible in this window with '+w.daysLeft+' days left.',categories:['fitness'],kind:'fitness',deficit:d.targets.fitnessDays-hit});}}
return out;}
function queueAlerts(d,reason='plan'){if(!d)return;view.alertQueue=view.alertQueue.filter(a=>a.day!==d.id).concat(computeAlerts(d,reason));if($('#modalBack').hidden&&!view.alertActive&&!view.shift&&!data.meta.pendingWakeShift)nextAlert();}
function nextAlert(){if(!$('#modalBack').hidden||view.alertActive)return;const a=view.alertQueue.shift();if(!a){if(view.shift||data.meta.pendingWakeShift)showWakeShift();return;}const d=getDay(a.day);if(!d||paused(d)){nextAlert();return;}const shown=d.alerts[a.key];if(shown&&shown.value===a.value&&shown.target===a.target){nextAlert();return;}view.alertActive=true;d.alerts[a.key]={value:a.value,target:a.target,bypassed:false,shownAt:new Date().toISOString()};data.meta.revision++;save();const actual=a.unit==='time'?duration(a.value):a.value+' days',target=a.unit==='time'?duration(a.target):a.target+' days';const free=d.blocks.filter(b=>b.category==='free'&&b.status==='unmarked').reduce((n,b)=>n+b.end-b.start,0),convert=Math.min(free,a.deficit||0),cat=a.categories?.find(id=>!category(id).archived)||a.categories?.[0]||'work';const fix=a.kind==='convert'&&convert>0?'Convert '+duration(convert)+' of '+category('free').name+' to '+category(cat).name:a.kind==='sleep'?'Extend Sleep by '+duration(Math.min(a.deficit||60,480)):a.kind==='fitness'?'Review fitness checkboxes':'Find time in the plan';const finish=(bypass)=>{d.alerts[a.key].bypassed=bypass;d.alerts[a.key].decidedAt=new Date().toISOString();save();view.alertActive=false;closeModal();};modal(a.title,'<div class="notice '+(a.kind==='sleep'?'good':'')+'"><b>'+esc(a.name)+'</b><br>'+actual+' · '+(a.max?'at most ':'required ')+target+'</div><p class="small gap">'+esc(a.why)+'</p><p class="small gap">'+dateLabel(d.date,true)+' · '+(d.ended?'Actual totals':'Projected totals')+'</p>',[{label:'Keep as is',run:()=>{finish(true);nextAlert();}},{label:'Open schedule',run:()=>{finish(false);view.tab='plan';view.date=d.date;view.id=d.id;renderApp();}},{label:fix,cls:'primary',run:()=>{finish(false);view.tab='plan';view.date=d.date;view.id=d.id;if(d.ended){renderApp();toast('Unlock this archived day to correct its recorded time.');return;}if(a.kind==='convert'&&convert>0){mutate('Free time reassigned',()=>{let remaining=convert;const next=[];for(const b of d.blocks){if(b.category==='free'&&b.status==='unmarked'&&remaining>0){const len=Math.min(remaining,b.end-b.start);next.push({...b,category:cat,end:b.start+len,title:''});if(len<b.end-b.start)next.push({...b,id:uid(),start:b.start+len});remaining-=len;}else next.push(b);}d.blocks=next;});queueAlerts(d,'plan');}else if(a.kind==='sleep'){mutate('Sleep extended',()=>{const b=sleepBlock(d);b.end+=Math.min(a.deficit||60,480);delete b.actualEnd;delete b.actualStart;});queueAlerts(d,'plan');}else renderApp();}}],()=>{d.alerts[a.key].bypassed=true;save();view.alertActive=false;nextAlert();});}
/* Pause epochs isolate counters while the archive and streak remain intact. */
function pauseEditor(){const current=data.meta.pauses.find(p=>!p.resumedDate&&activeDay().date>=p.start&&(!p.end||activeDay().date<=p.end));modal('Skip / pause',current?'<div class="notice">Paused from '+dateLabel(current.start,true)+(current.end?' through '+dateLabel(current.end,true):' until you resume')+'. Requirements and collection are suspended.</div>':field('Start date','pauseStart',dateInput('pauseStart',activeDay().date,activeDay().date,addMonths(dateKey(),6)))+field('End date (inclusive, optional)','pauseEnd','<input type="date" id="pauseEnd" min="'+activeDay().date+'" max="'+addMonths(dateKey(),6)+'">')+'<p class="small">Leave the end blank to pause until you resume. The streak pauses. Resuming creates a fresh tracking session and resets daily and weekly counters.</p>',current?[{label:'Close',run:closeModal},{label:'Resume now',cls:'primary',run:resume}]:[{label:'Cancel',run:closeModal},{label:'Pause tracking',cls:'primary',run:()=>{const start=val('pauseStart'),end=val('pauseEnd')||null;if(!validDate(start)||start<activeDay().date||end&&(!validDate(end)||end<start))return formError('Choose an end on or after the start.');closeModal();mutate('Tracking paused',()=>{data.meta.pauses.push({id:uid(),start,end,resumedDate:null});for(const d of Object.values(data.days))if(d.date>=start&&(!end||d.date<=end))d.paused=true;});view.alertQueue=[];}}]);}
function resumeData(p){const today=dateKey();p.resumedDate=today;p.resumedAt=new Date().toISOString();const old=activeDay();if(old){old.ended=true;old.paused=true;}for(const future of Object.values(data.days)){if(future.id!==old?.id&&!future.ended&&future.date>=today&&!pausedDate(future.date))future.paused=false;}data.meta.epochId=uid();data.meta.epochStart=today;const start=new Date().getHours()*60+new Date().getMinutes(),previous=findDay(today),d=createDay(today,start,{active:true,freshSession:true});d.paused=false;d.resumeFresh=true;d.epochId=data.meta.epochId;d.fitness={plan:false,diet:false};if(previous?.planned){d.blocks=copyBlocks(previous,{start:previous.start});d.base=clone(previous.base);d.planned=true;d.start=previous.start;alignStart(d,start,false);d.base=clone(d.blocks);}else{d.base=clone(d.blocks);}view.id=null;view.date=today;view.selected.clear();view.alertQueue=[];}
function resume(){const p=[...data.meta.pauses].reverse().find(p=>!p.resumedDate&&p.start<=dateKey());if(!p){toast('Tracking is already active.');return;}closeModal();mutate('Tracking resumed',()=>resumeData(p));view.tab='today';renderApp();}
