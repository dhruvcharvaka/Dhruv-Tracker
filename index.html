function backupEditor(after=null){const serialized=()=>JSON.stringify(exportDocument(),null,2);modal('Backup & transfer','<p>Your backup contains schedules, completions, notes, settings, recurrence exceptions, pauses, and the Undo history.</p><p class="small gap">Last backed up: '+(data.meta.lastBackup?new Date(data.meta.lastBackup).toLocaleString():'Never')+'</p><div class="stack gap"><button id="downloadBackup" class="primary">Download JSON</button><button id="shareBackup">Share JSON file</button><button id="copyBackup">Copy as text</button></div><details><summary>Or select and copy manually</summary><textarea id="backupText" class="codearea" readonly>'+esc(serialized())+'</textarea></details><p id="backupResult" class="small gap" role="status"></p>',[{label:after?'Continue':'Close',run:()=>{closeModal();if(after)after();}}]);$('#downloadBackup').onclick=()=>{markBackup();const blob=new Blob([serialized()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dayline-'+dateKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('#backupResult').textContent='Download requested. Keep this file somewhere you can find it.';};$('#copyBackup').onclick=async()=>{try{const when=new Date().toISOString(),x=exportDocument();x.data.meta.lastBackup=when;await navigator.clipboard.writeText(JSON.stringify(x,null,2));data.meta.lastBackup=when;save();$('#backupResult').textContent='Backup copied.';}catch(e){const el=$('#backupText');el.focus();el.select();$('#backupResult').textContent='Clipboard access is unavailable. The text is selected for manual copying.';}};$('#shareBackup').onclick=async()=>{try{const when=new Date().toISOString(),x=exportDocument();x.data.meta.lastBackup=when;const file=new File([JSON.stringify(x,null,2)],'dayline-'+dateKey()+'.json',{type:'application/json'});if(!navigator.canShare?.({files:[file]})){ $('#backupResult').textContent='File sharing is unavailable here. Download JSON or copy the text.';return;}await navigator.share({files:[file],title:'Dayline backup'});data.meta.lastBackup=when;save();$('#backupResult').textContent='Backup shared.';}catch(e){$('#backupResult').textContent=e.name==='AbortError'?'Share cancelled.':'Could not share. Download JSON or copy the text.';}};}
function validateBackup(input){if(!input||input.format!=='dayline-backup'||!input.data)throw Error('This is not a Dayline backup.');const x=migrate(input.data);if(!x.meta||!Array.isArray(x.categories)||!x.days||Array.isArray(x.days)||!Array.isArray(x.events)||!Array.isArray(x.series))throw Error('The backup is missing required data.');if(!['system','light','dark'].includes(x.settings.theme)||![1,5,15,30].includes(x.settings.snap))throw Error('Invalid appearance or time-snap settings.');if(x.categories.length>1000||Object.keys(x.days).length>5000||x.events.length>10000||x.series.length>1000)throw Error('This backup exceeds supported limits.');const ids=new Set();for(const c of x.categories){if(typeof c.id!=='string'||!/[a-z0-9-]+/i.test(c.id)||['constructor','prototype','__proto__'].includes(c.id)||ids.has(c.id)||typeof c.name!=='string'||!/^#[0-9a-f]{6}$/i.test(c.color))throw Error('Invalid category data.');ids.add(c.id);}for(const id of ['sleep','free','break'])if(!ids.has(id))throw Error('A reserved category is missing.');const checkTargets=t=>{if(!t?.daily||!t?.weekly||!t.sleepRules||!['both','either'].includes(t.fitnessMode))throw Error('Invalid targets.');for(const group of ['daily','weekly'])for(const r of Object.values(t[group]))if(!Number.isInteger(r.minutes)||r.minutes<0||!Array.isArray(r.categories)||!r.categories.length||r.categories.some(id=>!ids.has(id)||['break','free'].includes(id)))throw Error('Invalid target mapping.');for(const k of ['background','work','creative','relationships','sleep'])if(!t.daily[k])throw Error('A daily target is missing.');for(const k of ['work','sleep','girlfriend','parents','friends'])if(!t.weekly[k])throw Error('A weekly target is missing.');if(!Number.isInteger(t.fitnessDays)||t.fitnessDays<0||t.fitnessDays>7)throw Error('Invalid fitness target.');for(const k of ['under6Minutes','under75Minutes','under6Allowed','under75Allowed'])if(!Number.isInteger(t.sleepRules[k])||t.sleepRules[k]<0)throw Error('Invalid sleep tolerance.');};if(!Array.isArray(x.settings.history)||!x.settings.history.length)throw Error('Standards history is missing.');for(const h of x.settings.history){if(!validDate(h.from))throw Error('Invalid standards date.');checkTargets(h.targets);}for(const d of Object.values(x.days)){if(!/^\d{4}-\d{2}-\d{2}(~[a-z0-9-]+)?$/i.test(d.id)||!validDate(d.date)||!Number.isInteger(d.start)||d.start<0||!Array.isArray(d.blocks)||!Array.isArray(d.base)||typeof d.note!=='string'||!d.fitness||d.blocks.length>1000)throw Error('Invalid day record.');checkTargets(d.targets);for(const list of [d.blocks,d.base]){if(list.filter(b=>b.finalSleep).length!==1||list.filter(b=>b.finalSleep&&b.category==='sleep').length!==1||[...list].sort((a,b)=>a.end-b.end).at(-1)?.finalSleep!==true)throw Error('A day is missing its final Sleep block.');let planEdge=0;for(const block of [...list].sort((a,b)=>a.start-b.start)){if(block.start<planEdge)throw Error('Overlapping blocks in a backup.');planEdge=block.end;}const blockIds=new Set();for(const b of list){if(!ids.has(b.category)||typeof b.id!=='string'||blockIds.has(b.id)||!Number.isInteger(b.start)||!Number.isInteger(b.end)||b.end<=b.start||b.start<0||b.end>10080||!['unmarked','done','skipped'].includes(b.status)||b.actualStart!=null&&(!Number.isInteger(b.actualStart)||b.actualStart<0)||b.actualEnd!=null&&(!Number.isInteger(b.actualEnd)||b.actualEnd<=(b.actualStart??b.start)))throw Error('Invalid block or actual-sleep data.');blockIds.add(b.id);}}}for(const p of x.meta.pauses)if(!validDate(p.start)||p.end&&!validDate(p.end)||p.resumedDate&&!validDate(p.resumedDate))throw Error('Invalid pause dates.');for(const list of [x.events,x.series])for(const e of list){if(!validDate(e.date)||typeof e.id!=='string'||!['none','daily','weekly','monthly','yearly','custom'].includes(e.repeat?.freq)||!Number.isInteger(e.repeat.interval||1)||(e.repeat.interval||1)<1||e.repeat.until&&!validDate(e.repeat.until))throw Error('Invalid recurring item.');if(list===x.events&&(!['important','event','deadline','task'].includes(e.kind)||typeof e.title!=='string'))throw Error('Invalid calendar item.');if(e.exceptions&&typeof e.exceptions!=='object')throw Error('Invalid recurrence exceptions.');if(list===x.series&&(!e.block||!ids.has(e.block.category)||!Number.isInteger(e.block.start)||!Number.isInteger(e.block.end)||e.block.end<=e.block.start))throw Error('Invalid recurring block.');}if(!validDate(x.meta.createdDate)||!validDate(x.meta.epochStart))throw Error('Invalid tracker dates.');if(x.meta.activeId&&!x.days[x.meta.activeId])throw Error('Active day is missing.');/* Undo snapshots are validated only when undone; untrusted histories are kept inert. */return x;}
function importEditor(){modal('Import a backup','<p class="small field">Choose a JSON file or paste its complete contents. Nothing changes until you review and confirm.</p>'+field('Backup file','importFile','<input id="importFile" type="file" accept=".json,application/json">')+field('Or paste backup text','importText','<textarea id="importText" class="codearea" placeholder="{ … }"></textarea>'),[{label:'Cancel',run:closeModal},{label:'Preview import',cls:'primary',run:async()=>{try{let text=val('importText').trim();const f=$('#importFile').files[0];if(f){if(f.size>15*1024*1024)throw Error('Choose a backup smaller than 15 MB.');text=await f.text();}if(!text)throw Error('Choose a file or paste your backup.');if(text.length>15*1024*1024)throw Error('Backup text is too large.');const x=validateBackup(JSON.parse(text));importPreview(x);}catch(e){formError('Could not import: '+e.message);}}}]);}
function importPreview(x){const done=Object.values(x.days).reduce((n,d)=>n+d.blocks.filter(b=>b.status==='done').length,0);modal('Review import','<div class="notice">This replaces all data currently saved on this device.</div><ul class="hrlist"><li>'+Object.keys(x.days).length+' day records</li><li>'+done+' completed blocks</li><li>'+x.events.length+' calendar series / items</li><li>'+x.series.length+' recurring schedule series</li><li>Tracking began '+dateLabel(x.meta.createdDate,true)+'</li><li>Schema '+x.schemaVersion+'</li></ul><p class="small">Export this device’s current data first if you may need it.</p>',[{label:'Export current',run:()=>backupEditor(()=>importPreview(x))},{label:'Cancel',run:closeModal},{label:'Replace with import',cls:'primary',run:async()=>{closeModal();data=clone(x);loaded=true;await save();view={...view,tab:'today',id:null,date:activeDay()?.date||dateKey(),selected:new Set(),alertQueue:[],alertActive:false,unlocked:new Set()};renderApp();toast(storageFailed?'Imported in memory; export now because saving failed.':'Backup restored.');/* Preserve the imported state exactly; clock reconciliation happens on the next foreground tick. */}}]);}
function wipePrompt(){modal('Export before wiping','<p>Wiping removes this device’s entire Dayline archive, settings, and Undo history. Make a backup first.</p>',[{label:'Cancel',run:closeModal},{label:'Export first',cls:'primary',run:()=>backupEditor(wipeConfirm)},{label:'Continue without backup',run:wipeConfirm}]);}
function wipeConfirm(){modal('Wipe everything',field('Type WIPE to confirm','wipeWord','<input id="wipeWord" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="WIPE">')+'<p class="small">This cannot be undone.</p>',[{label:'Cancel',run:closeModal},{label:'Wipe this device',cls:'danger',run:async()=>{if(val('wipeWord')!=='WIPE')return formError('Type WIPE exactly.');closeModal();data=fresh();createDay(dateKey(),Math.min(420,nowMinute(dateKey())),{active:true});view.tab='today';view.id=null;view.date=activeDay().date;view.alertQueue=[];view.selected.clear();view.alertActive=false;await save();renderApp();toast('A fresh start.');}}]);}
/* Retention never silently discards history before the notice and export choice. */
function retentionCandidates(){const past=addMonths(dateKey(),-4),future=addMonths(dateKey(),6);const days=Object.values(data.days).filter(d=>d.id!==data.meta.activeId&&(d.date<past||d.date>future));const events=data.events.filter(e=>{if(e.repeat?.freq==='yearly'||e.repeat?.freq==='custom'&&e.repeat.unit==='yearly')return false;if(e.repeat?.freq!=='none')return e.repeat.until&&e.repeat.until<past;return e.date<past||e.date>future;});const series=data.series.filter(s=>!(s.repeat?.freq==='yearly'||s.repeat?.freq==='custom'&&s.repeat.unit==='yearly')&&s.repeat?.until&&s.repeat.until<past);return {past,future,days,events,series,count:days.length+events.length+series.length};}
function prune(){const c=retentionCandidates();if(!c.count)return;mutate('Old records pruned',()=>{for(const d of c.days)delete data.days[d.id];const ids=new Set(c.events.map(e=>e.id)),sids=new Set(c.series.map(s=>s.id));data.events=data.events.filter(e=>!ids.has(e.id));data.series=data.series.filter(s=>!sids.has(s.id));for(const e of [...data.events,...data.series])for(const date of Object.keys(e.exceptions||{})){const x=e.exceptions[date];if(e.repeat?.freq==='yearly'||e.repeat?.freq==='custom'&&e.repeat.unit==='yearly')continue;if(date<c.past&&(!x.date||x.date<c.past))delete e.exceptions[date];}/* Retention also retires Undo snapshots that could resurrect pruned data. */data.undo=[];},{undo:false,notify:false});}
let retentionChecked=false;function checkRetention(){if(retentionChecked)return;retentionChecked=true;const c=retentionCandidates();if(!c.count)return;if(data.meta.pruneConsent){prune();return;}if(!data.meta.pruneNotice&&$('#modalBack').hidden){data.meta.pruneNotice=true;save();retentionEditor(true);}}
function retentionEditor(first=false){const c=retentionCandidates();modal(first?'Before older data is removed':'Data retention','<p>Daily trackers and plans are retained from '+dateLabel(c.past,true)+' through '+dateLabel(c.future,true)+'. Yearly repeating items are exempt. Ongoing repeating series remain so future occurrences can be generated.</p><p class="small gap">'+c.count+' record(s) are outside the window. Export before enabling automatic pruning. If you choose Keep for now, records stay until you enable pruning here.</p><p class="small gap">After pruning, Undo history is cleared so it cannot bring removed data back.</p>',[{label:'Keep for now',run:closeModal},{label:'Export first',run:()=>backupEditor(()=>retentionEditor())},{label:'Enable pruning',cls:'primary',run:()=>{closeModal();data.meta.pruneConsent=true;save();prune();toast('Retention enabled. Yearly items are preserved.');}}]);}
function help(){modal('A few clear rules','<div class="stack"><div><h3>A day ends with sleep</h3><p class="small gap">The day label is the calendar date when it starts. Its final Sleep ends the day, even after midnight. 23:00–07:00 is stored as 1380–1860 minutes. A nap may also use Sleep. Log actual sleep or tap “I’m awake” to move the boundary.</p></div><div><h3>One tap to count time</h3><p class="small gap">Tap a block’s round check to mark Done. Tap again to unmark it. Only Done counts. Skipped never counts. Unmarked blocks remain yours to decide, even when overdue. Use Select to mark several blocks together.</p></div><div><h3>Minimums and adherence are different</h3><p class="small gap">A successful day meets Background, Work, Creative/Skill, combined Relationships, and the fitness checkbox rule. Sleep is alert-only. Adherence is completed minutes divided by minutes in the original base plan; it can exceed 100%. Ahead/behind compares all completed minutes to elapsed base-plan minutes.</p></div><div><h3>Two views of the week</h3><p class="small gap">Rolling 7 is this day plus its six previous labels. Mon–Sun uses fixed labels, resetting with the Monday day. Both count completed time, with the same saved standards. A short sleep counts toward both sleep tolerances when below both thresholds. Missed tracked days have zero Done sleep and count as short nights.</p></div><div><h3>Plans can change</h3><p class="small gap">The pale bar is still-planned time; the solid bar is Done. Edit anytime. The base plan stays separate until you explicitly replace it. Past days require Unlock. Changes recalculate immediately. At least the last 10 changes can be undone.</p></div><div><h3>Calendar repeats</h3><p class="small gap">Important Dates, Events, and Deadlines have independent visibility. Tasks live in Deadlines. Edit an occurrence to move only that one. Whole-series edits preserve existing exceptions. Monthly dates clamp to month-end; February 29 uses February 28 in non-leap years.</p></div><div><h3>A pause gives you a fresh start</h3><p class="small gap">Paused days collect nothing and do not break a streak. Resume starts a new counter epoch. Historical data stays in the archive; only the new epoch contributes to current daily/weekly counters. The first seven days of each epoch soften weekly alerts to unreachable rules.</p></div><div><h3>Private and local</h3><p class="small gap">IndexedDB saves every change. localStorage is a visible fallback only if IndexedDB cannot open, suitable for the small text dataset. Browser or device cleanup can remove local storage. Export JSON for manual backup and transfer. No push notifications, accounts, or sync. Offline readiness is shown in More; a secure browser context is required for offline installation.</p></div></div>',[{label:'Got it',cls:'primary',run:closeModal}]);}

async function action(act,p={}){switch(act){case 'tab':closeModal();view.tab=p.tab;view.selecting=false;view.selected.clear();if(p.tab==='today'){view.date=activeDay().date;view.id=null;}if(p.tab==='plan'&&!view.id)view.date=activeDay().date;renderApp();window.scrollTo(0,0);break;case 'undo':undo();break;case 'hide-toast':$('#toast').classList.add('hidden');break;case 'retry-save':save();break;case 'open-plan':closeModal();view.tab='plan';view.date=p.date;view.id=p.id||null;view.selecting=false;view.selected.clear();renderApp();window.scrollTo(0,0);break;case 'plan-date':if(p.date<addMonths(dateKey(),-4)||p.date>addMonths(dateKey(),6))return toast('That date is outside the planning window.');view.date=p.date;view.id=null;view.selected.clear();renderApp();break;case 'toggle-select':view.selecting=!view.selecting;view.selected.clear();renderApp();break;case 'add-block':closeModal();blockEditor({...p,id:null});break;case 'edit-block':blockEditor(p);break;case 'delete-block':deleteBlock(p);break;case 'split-block':splitBlock(p);break;case 'sleep-actual':actualSleep(p);break;case 'awake':awake(p);break;case 'mark':{const d=getDay(p.day),b=d.blocks.find(b=>b.id===p.id);if(!editable(d))return;mutate(b.status==='done'?'Block unmarked':'Block completed',()=>{b.status=b.status==='done'?'unmarked':'done';});$('#announcer').textContent=(b.title||category(b.category).name)+(b.status==='done'?' completed.':' unmarked.');break;}case 'mark-selected':{const d=getDay(p.day);if(!editable(d))return;const ids=new Set(view.selected);if(!ids.size)return toast('Select at least one block.');mutate('Selected blocks '+p.status,()=>{d.blocks.forEach(b=>{if(ids.has(b.id))b.status=p.status;});view.selected.clear();view.selecting=false;});if(p.status==='skipped')queueAlerts(d,'skip');break;}case 'past-done':{const d=getDay(p.day);if(!editable(d))return;const n=nowMinute(d.date);mutate('Past blocks completed',()=>d.blocks.forEach(b=>{if(b.end<=n&&b.status==='unmarked')b.status='done';}));break;}case 'fill-free':{const d=getDay(p.day);if(!editable(d))return;commitPlan(d,d.blocks.concat({id:uid(),category:'free',start:p.start,end:p.end,title:'',note:'',status:'unmarked'}),'Gap filled with Free');break;}case 'unlock':if(!p.day)return toast('No archived record exists on this date.');view.unlocked.add(p.day);renderApp();toast('Archive unlocked. Edits recalculate its tracker.');break;case 'base-plan':{const d=getDay(p.day);modal('Original base plan','<div class="small">'+d.base.map(b=>'<div class="event"><span>'+timeLong(b.start)+'–'+timeLong(b.end)+'</span><b>'+esc(b.title||category(b.category).name)+'</b></div>').join('')+'</div><p class="small gap">'+changedCount(d)+' block changes in the current plan. Status changes do not alter the base.</p>',[{label:'Close',run:closeModal}]);break;}case 'rebase':{const d=getDay(p.day);modal('Replace the original base?','<p>Adherence and ahead/behind will use the current schedule as their baseline. This action has Undo.</p>',[{label:'Cancel',run:closeModal},{label:'Use current plan',cls:'primary',run:()=>{closeModal();mutate('Base plan replaced',()=>d.base=clone(d.blocks).map(b=>({...b,status:'unmarked'})));}}]);break;}case 'reset-day':{const d=getDay(p.day);if(!editable(d))return toast('Unlock this day or resume tracking first.');modal('Reset this day?','<p>Restore the original schedule, clear block statuses, actual sleep, and fitness checkboxes. Your daily note stays. You can Undo.</p>',[{label:'Cancel',run:closeModal},{label:'Reset to base',cls:'primary',run:()=>{closeModal();mutate('Day reset to base',()=>{d.blocks=clone(d.base).map(b=>{const x={...b,status:'unmarked'};delete x.actualStart;delete x.actualEnd;return x;});d.fitness={plan:false,diet:false};alignStart(d,d.start,false);});queueAlerts(d,'plan');}}]);break;}case 'copy-yesterday':copyDay({date:p.date,source:addDays(p.date,-1)});break;case 'copy-day':copyDay(p);break;case 'use-template':useTemplate(p);break;case 'plan-options':planOptions(p);break;case 'save-template':{const d=getDay(p.day);mutate(p.type+' template saved',()=>data.templates[p.type]={start:d.start,blocks:clone(d.blocks)});closeModal();break;}case 'templates':planOptions({date:activeDay().date,day:data.meta.activeId});break;case 'series-list':seriesList();break;case 'edit-series':seriesEditor(p);break;case 'stop-series':{const s=data.series.find(x=>x.id===p.id);closeModal();mutate('Future repeats stopped',()=>{s.repeat.until=addDays(activeDay().date,-1);for(const d of Object.values(data.days))if(!d.ended&&d.date>=activeDay().date)d.blocks=d.blocks.filter(b=>b.seriesId!==s.id||b.status!=='unmarked');});seriesList();break;}case 'edit-event':eventEditor(p);break;case 'delete-event':deleteEvent(p);break;case 'targets':targetsEditor();break;case 'categories':categoriesEditor();break;case 'edit-category':categoryEditor(p);break;case 'settings':settingsEditor();break;case 'week-mode':view.weekMode=p.mode;renderApp();break;case 'cal-month':view.month=addMonths(view.month,p.n);renderApp();break;case 'cal-date':view.date=p.date;renderApp();break;case 'cal-today':view.month=dateKey().slice(0,7)+'-01';view.date=dateKey();renderApp();break;case 'cal-toggle':mutate('Calendar visibility changed',()=>data.settings.calendars[p.kind]=!data.settings.calendars[p.kind],{undo:false,notify:false});break;case 'pause':pauseEditor();break;case 'resume':resume();break;case 'backup':backupEditor();break;case 'import':importEditor();break;case 'wipe':wipePrompt();break;case 'retention':retentionEditor();break;case 'help':help();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;try{const p=JSON.parse(el.dataset.p||'{}');Promise.resolve(action(el.dataset.action,p)).catch(err=>{if(!$('#modalBack').hidden)formError(err.message);else toast(err.message);});}catch(err){toast(err.message);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.select){if(el.checked)view.selected.add(el.dataset.select);else view.selected.delete(el.dataset.select);const pos=window.scrollY;renderApp();window.scrollTo(0,pos);}if(el.dataset.fitness){const d=getDay(el.dataset.day);if(!editable(d))return;const key=el.dataset.fitness,value=el.checked;mutate('Fitness updated',()=>d.fitness[key]=value,{notify:false});}if(el.dataset.task){if(paused(activeDay()))return;const item=data.events.find(x=>x.id===el.dataset.task),origin=el.dataset.origin,value=el.checked;if(!item)return;mutate(value?'Task completed':'Task reopened',()=>{if(item.repeat?.freq!=='none'){item.exceptions=item.exceptions||{};item.exceptions[origin]={...(item.exceptions[origin]||{}),date:item.exceptions[origin]?.date||origin,completed:value};}else item.completed=value;});}if(el.id==='planDate')action('plan-date',{date:el.value});if(el.id==='weekDate'){view.weekDate=el.value;renderApp();}if(el.id==='sessionSelect'){view.id=el.value;renderApp();}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.noteDay){const d=getDay(el.dataset.noteDay);if(!editable(d))return;d.note=el.value;data.meta.revision++;save();}if(el.id==='searchBox'){view.search=el.value;$('#searchResults').innerHTML=searchHTML(el.value);}});
$('#modalClose').onclick=dismissModal;$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')dismissModal();});document.addEventListener('keydown',e=>{if(!$('#modalBack').hidden){if(e.key==='Escape'){e.preventDefault();dismissModal();}if(e.key==='Tab'){const focusable=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]',$('#modal')).filter(x=>x.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}else if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();undo();}});
async function offlineSetup(){if(!('serviceWorker'in navigator)||!window.isSecureContext){window.offlineState='Offline installation requires a secure browser context. Your data still saves locally.';return;}try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;window.offlineState='Offline files ready on this device.';reg.update().catch(()=>{});reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('Updated app files are ready. Reopen to use them.');});});}catch(e){window.offlineState='Offline files are not ready: '+e.message;}if(view.tab==='more')renderApp();}
async function boot(){try{const raw=await openStorage();data=raw?validateBackup({format:'dayline-backup',data:raw}):fresh();loaded=true;if(!activeDay())createDay(dateKey(),Math.min(420,nowMinute(dateKey())),{active:true});view.date=activeDay().date;view.month=activeDay().date.slice(0,7)+'-01';await save();renderApp();advanceClock();navigator.storage?.persist?.().then(granted=>{window.persistenceGranted=granted;}).catch(()=>{});offlineSetup();setInterval(()=>{if(document.hidden)return;advanceClock();if($('#modalBack').hidden&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))renderApp();if($('#modalBack').hidden)nextAlert();},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){advanceClock();renderApp();navigator.serviceWorker?.getRegistration?.().then(r=>r?.update().catch(()=>{})).catch(()=>{});}});window.addEventListener('online',()=>offlineSetup());}catch(e){loaded=false;$('#saveState').textContent='Storage unavailable';$('#app').innerHTML='<main><div class="card"><h1>Your data needs attention</h1><p class="gap">'+esc(e.message)+'</p><p class="small gap">Nothing has been overwritten. You may import a known backup or explicitly start fresh.</p>'+button('Import backup','import',{},'primary gap')+button('Start fresh','recovery-fresh',{},'gap')+'</div></main>';data=data||fresh();}}
const originalAction=action;action=async function(act,p){if(act==='recovery-fresh'){modal('Start fresh on this device?','<p>This replaces inaccessible local data. Continue only if you have a backup or accept starting over.</p>',[{label:'Cancel',run:closeModal},{label:'Start fresh',cls:'danger',run:()=>{closeModal();data=fresh();loaded=true;createDay(dateKey(),Math.min(420,nowMinute(dateKey())),{active:true});save();renderApp();}}]);return;}return originalAction(act,p);};
boot();
